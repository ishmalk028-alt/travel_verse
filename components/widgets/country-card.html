<!-- 
    Country Card Widget
    Trip Planner Website
    
    Usage: Use as template for displaying country cards
    
    Data attributes:
    - data-country-id: Country ID
    - data-country-name: Country name
-->

<!-- Country Card Template -->
<div class="card card--country card--selectable" data-country-id="{{id}}">
    <img src="{{imageUrl}}" alt="{{name}}" class="card__image">
    <div class="card__overlay">
        <span class="card__badge">{{continent}}</span>
        <h3 class="card__title">{{name}}</h3>
        <p class="card__subtitle">{{description}}</p>
    </div>
    <div class="card__checkbox" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
    </div>
</div>

<style>
    /* Country Card Additional Styles */
    .card--country {
        position: relative;
        cursor: pointer;
    }
    
    .card--country .card__image {
        height: 280px;
        transition: transform var(--transition-slow);
    }
    
    .card--country:hover .card__image {
        transform: scale(1.05);
    }
    
    .card--country .card__overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: var(--space-6);
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
        color: var(--color-white);
    }
    
    .card--country .card__badge {
        margin-bottom: var(--space-2);
    }
    
    .card--country .card__title {
        color: var(--color-white);
        font-size: var(--text-2xl);
        margin-bottom: var(--space-1);
    }
    
    .card--country .card__subtitle {
        color: var(--color-gray-300);
        font-size: var(--text-sm);
        margin: 0;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    
    .card--country .card__checkbox {
        position: absolute;
        top: var(--space-4);
        right: var(--space-4);
        width: 28px;
        height: 28px;
        border: 2px solid var(--color-white);
        border-radius: var(--radius-md);
        background-color: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: all var(--transition-fast);
    }
    
    .card--country:hover .card__checkbox {
        opacity: 1;
    }
    
    .card--country.is-selected .card__checkbox {
        opacity: 1;
        background-color: var(--color-primary);
        border-color: var(--color-primary);
    }
    
    .card--country .card__checkbox svg {
        width: 16px;
        height: 16px;
        color: var(--color-white);
        opacity: 0;
    }
    
    .card--country.is-selected .card__checkbox svg {
        opacity: 1;
    }
</style>
