<!-- 
    Progress Stepper Widget
    Trip Planner Website
    
    Usage: Shows the current step in the booking flow
-->

<div class="stepper" id="bookingStepper">
    <div class="stepper__track"></div>
    
    <div class="stepper__step is-completed" data-step="1">
        <div class="stepper__step-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
        </div>
        <span class="stepper__step-label">Dates</span>
    </div>
    
    <div class="stepper__step is-completed" data-step="2">
        <div class="stepper__step-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
        </div>
        <span class="stepper__step-label">Countries</span>
    </div>
    
    <div class="stepper__step is-active" data-step="3">
        <div class="stepper__step-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"></path>
                <circle cx="12" cy="10" r="3"></circle>
            </svg>
        </div>
        <span class="stepper__step-label">Cities</span>
    </div>
    
    <div class="stepper__step" data-step="4">
        <div class="stepper__step-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
        </div>
        <span class="stepper__step-label">Hotels</span>
    </div>
    
    <div class="stepper__step" data-step="5">
        <div class="stepper__step-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
        </div>
        <span class="stepper__step-label">Activities</span>
    </div>
    
    <div class="stepper__step" data-step="6">
        <div class="stepper__step-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
        </div>
        <span class="stepper__step-label">Summary</span>
    </div>
    
    <div class="stepper__step" data-step="7">
        <div class="stepper__step-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                <line x1="1" y1="10" x2="23" y2="10"></line>
            </svg>
        </div>
        <span class="stepper__step-label">Checkout</span>
    </div>
</div>

<style>
    /* Stepper Styles */
    .stepper {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        position: relative;
        padding: var(--space-4) 0;
        margin-bottom: var(--space-8);
    }
    
    .stepper__track {
        position: absolute;
        top: 28px;
        left: 40px;
        right: 40px;
        height: 2px;
        background-color: var(--color-gray-200);
    }
    
    .stepper__step {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        z-index: 1;
    }
    
    .stepper__step-icon {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--color-white);
        border: 2px solid var(--color-gray-300);
        border-radius: var(--radius-full);
        color: var(--color-gray-400);
        margin-bottom: var(--space-2);
        transition: all var(--transition-fast);
    }
    
    .stepper__step-icon svg {
        width: 24px;
        height: 24px;
    }
    
    .stepper__step-label {
        font-size: var(--text-xs);
        font-weight: var(--font-medium);
        color: var(--color-gray-500);
        text-align: center;
        transition: color var(--transition-fast);
    }
    
    /* Completed State */
    .stepper__step.is-completed .stepper__step-icon {
        background-color: var(--color-success);
        border-color: var(--color-success);
        color: var(--color-white);
    }
    
    .stepper__step.is-completed .stepper__step-label {
        color: var(--color-success);
    }
    
    /* Active State */
    .stepper__step.is-active .stepper__step-icon {
        background-color: var(--color-primary);
        border-color: var(--color-primary);
        color: var(--color-white);
        box-shadow: 0 0 0 4px var(--color-primary-100);
    }
    
    .stepper__step.is-active .stepper__step-label {
        color: var(--color-primary);
        font-weight: var(--font-semibold);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
        .stepper {
            overflow-x: auto;
            padding-bottom: var(--space-4);
        }
        
        .stepper__step {
            min-width: 60px;
        }
        
        .stepper__step-icon {
            width: 40px;
            height: 40px;
        }
        
        .stepper__step-icon svg {
            width: 20px;
            height: 20px;
        }
        
        .stepper__step-label {
            font-size: 10px;
        }
        
        .stepper__track {
            top: 22px;
            left: 30px;
            right: 30px;
        }
    }
</style>
