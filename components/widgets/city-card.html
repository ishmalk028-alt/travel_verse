<!-- 
    City Card Widget
    Trip Planner Website
    
    Usage: Use as template for displaying city cards
-->

<!-- City Card Template -->
<div class="card card--city card--selectable" data-city-id="{{id}}">
    <img src="{{imageUrl}}" alt="{{name}}" class="card__image">
    <div class="card__body">
        <div class="card__header">
            <div>
                <h3 class="card__title">{{name}}</h3>
                <span class="card__country">{{countryName}}</span>
            </div>
            <div class="card__nights-control">
                <label class="card__nights-label">Nights</label>
                <div class="card__nights-input">
                    <button type="button" class="card__nights-btn" data-action="decrease">−</button>
                    <input type="number" class="card__nights-value" value="2" min="1" max="30" data-nights>
                    <button type="button" class="card__nights-btn" data-action="increase">+</button>
                </div>
            </div>
        </div>
        
        <p class="card__text">{{description}}</p>
        
        <div class="card__highlights">
            <span class="card__highlight">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
                {{hotelsCount}} Hotels
            </span>
            <span class="card__highlight">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
                </svg>
                {{activitiesCount}} Activities
            </span>
        </div>
    </div>
    
    <div class="card__selection">
        <span class="card__selection-check">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </span>
    </div>
</div>

<style>
    /* City Card Additional Styles */
    .card--city {
        position: relative;
        overflow: visible;
    }
    
    .card--city .card__image {
        height: 160px;
    }
    
    .card--city .card__header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: var(--space-2);
    }
    
    .card--city .card__title {
        font-size: var(--text-lg);
        margin-bottom: var(--space-1);
    }
    
    .card--city .card__country {
        font-size: var(--text-sm);
        color: var(--color-gray-500);
    }
    
    /* Nights Control */
    .card__nights-control {
        display: none;
        flex-direction: column;
        align-items: center;
    }
    
    .card--city.is-selected .card__nights-control {
        display: flex;
    }
    
    .card__nights-label {
        font-size: var(--text-xs);
        color: var(--color-gray-500);
        margin-bottom: var(--space-1);
    }
    
    .card__nights-input {
        display: flex;
        align-items: center;
        background-color: var(--color-gray-100);
        border-radius: var(--radius-lg);
        overflow: hidden;
    }
    
    .card__nights-btn {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: none;
        border: none;
        font-size: var(--text-lg);
        font-weight: var(--font-bold);
        color: var(--color-gray-600);
        cursor: pointer;
        transition: all var(--transition-fast);
    }
    
    .card__nights-btn:hover {
        background-color: var(--color-primary);
        color: var(--color-white);
    }
    
    .card__nights-value {
        width: 40px;
        height: 28px;
        text-align: center;
        border: none;
        background: none;
        font-size: var(--text-base);
        font-weight: var(--font-semibold);
        color: var(--color-gray-800);
        -moz-appearance: textfield;
    }
    
    .card__nights-value::-webkit-outer-spin-button,
    .card__nights-value::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    
    .card--city .card__text {
        font-size: var(--text-sm);
        color: var(--color-gray-600);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-bottom: var(--space-3);
    }
    
    /* Highlights */
    .card__highlights {
        display: flex;
        gap: var(--space-3);
    }
    
    .card__highlight {
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
        font-size: var(--text-xs);
        color: var(--color-gray-500);
    }
    
    .card__highlight svg {
        color: var(--color-primary);
    }
    
    /* Selection Indicator */
    .card--city .card__selection {
        position: absolute;
        top: var(--space-3);
        right: var(--space-3);
        width: 24px;
        height: 24px;
        border: 2px solid var(--color-white);
        border-radius: var(--radius-md);
        background-color: rgba(255, 255, 255, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: all var(--transition-fast);
    }
    
    .card--city:hover .card__selection {
        opacity: 1;
    }
    
    .card--city.is-selected .card__selection {
        opacity: 1;
        background-color: var(--color-primary);
        border-color: var(--color-primary);
    }
    
    .card--city .card__selection-check svg {
        width: 14px;
        height: 14px;
        color: var(--color-white);
        opacity: 0;
    }
    
    .card--city.is-selected .card__selection-check svg {
        opacity: 1;
    }
</style>
