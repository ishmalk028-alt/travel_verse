<!-- 
    Hotel Card Widget
    Trip Planner Website
    
    Usage: Use as template for displaying hotel cards
-->

<!-- Hotel Card Template -->
<div class="card card--hotel card--selectable" data-hotel-id="{{id}}">
    <img src="{{imageUrl}}" alt="{{name}}" class="card__image">
    <div class="card__body">
        <div class="card__header">
            <div>
                <h3 class="card__title">{{name}}</h3>
                <div class="card__rating">
                    <!-- Star Rating -->
                    <span class="card__stars">
                        ★★★★☆
                    </span>
                    <span class="card__review-count">({{reviewCount}} reviews)</span>
                </div>
            </div>
            <div class="card__price">
                ${{pricePerNight}}<span class="card__price-period">/night</span>
            </div>
        </div>
        
        <p class="card__text">{{description}}</p>
        
        <div class="card__amenities">
            <!-- Amenities will be dynamically populated -->
            <span class="card__amenity">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                    <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
                WiFi
            </span>
            <span class="card__amenity">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="3" y1="9" x2="21" y2="9"></line>
                    <line x1="9" y1="21" x2="9" y2="9"></line>
                </svg>
                Pool
            </span>
        </div>
        
        <div class="card__footer">
            <button class="btn btn--outline btn--sm">View Details</button>
            <button class="btn btn--primary btn--sm">Select</button>
        </div>
    </div>
</div>

<style>
    /* Hotel Card Additional Styles */
    .card--hotel .card__image {
        height: 200px;
    }
    
    .card--hotel .card__header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: var(--space-3);
    }
    
    .card--hotel .card__title {
        font-size: var(--text-lg);
        margin-bottom: var(--space-1);
    }
    
    .card--hotel .card__rating {
        display: flex;
        align-items: center;
        gap: var(--space-2);
    }
    
    .card--hotel .card__stars {
        color: var(--color-accent);
        font-size: var(--text-sm);
    }
    
    .card--hotel .card__review-count {
        font-size: var(--text-xs);
        color: var(--color-gray-500);
    }
    
    .card--hotel .card__price {
        font-family: var(--font-secondary);
        font-size: var(--text-xl);
        font-weight: var(--font-bold);
        color: var(--color-primary);
        white-space: nowrap;
    }
    
    .card--hotel .card__price-period {
        font-size: var(--text-sm);
        font-weight: var(--font-normal);
        color: var(--color-gray-500);
    }
    
    .card--hotel .card__text {
        font-size: var(--text-sm);
        color: var(--color-gray-600);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-bottom: var(--space-3);
    }
    
    .card--hotel .card__amenities {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        margin-bottom: var(--space-4);
    }
    
    .card--hotel .card__amenity {
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
        font-size: var(--text-xs);
        color: var(--color-gray-600);
        background-color: var(--color-gray-100);
        padding: var(--space-1) var(--space-2);
        border-radius: var(--radius-full);
    }
    
    .card--hotel .card__footer {
        display: flex;
        gap: var(--space-2);
        padding-top: var(--space-4);
        border-top: 1px solid var(--color-gray-100);
    }
    
    .card--hotel .card__footer .btn {
        flex: 1;
    }
</style>
