<!-- 
    Price Display Widget
    Trip Planner Website
    
    Usage: Use for consistent price formatting across the site
-->

<!-- Basic Price -->
<span class="price">
    <span class="price__currency">$</span>
    <span class="price__value">199</span>
</span>

<!-- Price with Period -->
<span class="price price--with-period">
    <span class="price__currency">$</span>
    <span class="price__value">99</span>
    <span class="price__period">/night</span>
</span>

<!-- Discounted Price -->
<span class="price price--discounted">
    <span class="price__original">$149</span>
    <span class="price__current">
        <span class="price__currency">$</span>
        <span class="price__value">99</span>
    </span>
    <span class="price__badge">33% OFF</span>
</span>

<!-- Total Price Summary -->
<div class="price-summary">
    <div class="price-summary__row">
        <span class="price-summary__label">Hotels (5 nights)</span>
        <span class="price-summary__value">$495</span>
    </div>
    <div class="price-summary__row">
        <span class="price-summary__label">Activities (3)</span>
        <span class="price-summary__value">$180</span>
    </div>
    <div class="price-summary__row price-summary__row--muted">
        <span class="price-summary__label">Service Fee</span>
        <span class="price-summary__value">$25</span>
    </div>
    <div class="price-summary__divider"></div>
    <div class="price-summary__row price-summary__row--total">
        <span class="price-summary__label">Total</span>
        <span class="price-summary__value">$700</span>
    </div>
</div>

<style>
    /* Basic Price */
    .price {
        display: inline-flex;
        align-items: baseline;
        font-family: var(--font-secondary);
    }
    
    .price__currency {
        font-size: 0.65em;
        font-weight: var(--font-semibold);
        margin-right: 2px;
    }
    
    .price__value {
        font-size: inherit;
        font-weight: var(--font-bold);
        color: inherit;
    }
    
    .price__period {
        font-size: 0.5em;
        font-weight: var(--font-normal);
        color: var(--color-gray-500);
        margin-left: 2px;
    }
    
    /* Price Sizes */
    .price--sm {
        font-size: var(--text-base);
    }
    
    .price--md {
        font-size: var(--text-xl);
    }
    
    .price--lg {
        font-size: var(--text-2xl);
    }
    
    /* Price Colors */
    .price--primary {
        color: var(--color-primary);
    }
    
    .price--success {
        color: var(--color-success);
    }
    
    /* Discounted Price */
    .price--discounted {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        flex-wrap: wrap;
    }
    
    .price__original {
        text-decoration: line-through;
        color: var(--color-gray-400);
        font-size: 0.85em;
    }
    
    .price__current {
        color: var(--color-error);
    }
    
    .price__badge {
        display: inline-block;
        padding: 2px var(--space-2);
        background-color: var(--color-error);
        color: var(--color-white);
        font-size: var(--text-xs);
        font-weight: var(--font-bold);
        border-radius: var(--radius-full);
    }
    
    /* Price Summary */
    .price-summary {
        background-color: var(--color-gray-50);
        border-radius: var(--radius-lg);
        padding: var(--space-5);
    }
    
    .price-summary__row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: var(--space-2) 0;
    }
    
    .price-summary__label {
        color: var(--color-gray-600);
    }
    
    .price-summary__value {
        font-weight: var(--font-semibold);
        color: var(--color-gray-800);
    }
    
    .price-summary__row--muted .price-summary__label,
    .price-summary__row--muted .price-summary__value {
        color: var(--color-gray-400);
        font-size: var(--text-sm);
    }
    
    .price-summary__divider {
        height: 1px;
        background-color: var(--color-gray-200);
        margin: var(--space-3) 0;
    }
    
    .price-summary__row--total {
        padding-top: var(--space-3);
    }
    
    .price-summary__row--total .price-summary__label {
        font-size: var(--text-lg);
        font-weight: var(--font-semibold);
        color: var(--color-gray-800);
    }
    
    .price-summary__row--total .price-summary__value {
        font-family: var(--font-secondary);
        font-size: var(--text-2xl);
        font-weight: var(--font-bold);
        color: var(--color-primary);
    }
</style>

<script>
    /**
     * Price Formatter Utility
     */
    const PriceDisplay = {
        /**
         * Format price value
         * @param {number} amount 
         * @param {string} currency - Currency code (USD, EUR, etc.)
         * @returns {string}
         */
        format(amount, currency = 'USD') {
            const symbols = {
                'USD': '$',
                'EUR': '€',
                'GBP': '£',
                'JPY': '¥'
            };
            
            const symbol = symbols[currency] || '$';
            const formatted = amount.toLocaleString('en-US', {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            });
            
            return `${symbol}${formatted}`;
        },
        
        /**
         * Create price HTML element
         * @param {number} amount 
         * @param {object} options 
         * @returns {string}
         */
        createPriceHTML(amount, options = {}) {
            const {
                currency = 'USD',
                period = null,
                size = 'md',
                color = 'primary'
            } = options;
            
            const symbols = { 'USD': '$', 'EUR': '€', 'GBP': '£', 'JPY': '¥' };
            const symbol = symbols[currency] || '$';
            
            let html = `<span class="price price--${size} price--${color}">`;
            html += `<span class="price__currency">${symbol}</span>`;
            html += `<span class="price__value">${amount}</span>`;
            
            if (period) {
                html += `<span class="price__period">/${period}</span>`;
            }
            
            html += `</span>`;
            
            return html;
        },
        
        /**
         * Create discounted price HTML
         * @param {number} original 
         * @param {number} current 
         * @param {string} currency 
         * @returns {string}
         */
        createDiscountedHTML(original, current, currency = 'USD') {
            const symbols = { 'USD': '$', 'EUR': '€', 'GBP': '£', 'JPY': '¥' };
            const symbol = symbols[currency] || '$';
            const discount = Math.round(((original - current) / original) * 100);
            
            return `
                <span class="price price--discounted">
                    <span class="price__original">${symbol}${original}</span>
                    <span class="price__current">
                        <span class="price__currency">${symbol}</span>
                        <span class="price__value">${current}</span>
                    </span>
                    <span class="price__badge">${discount}% OFF</span>
                </span>
            `;
        }
    };
</script>
