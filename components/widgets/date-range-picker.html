<!-- 
    Date Range Picker Widget
    Trip Planner Website
    
    Usage: Used for selecting start and end dates
-->

<div class="date-picker" id="dateRangePicker">
    <div class="date-picker__header">
        <h3 class="date-picker__title">Select Your Travel Dates</h3>
        <p class="date-picker__subtitle">Choose when you want to start and end your trip</p>
    </div>
    
    <div class="date-picker__inputs">
        <div class="form-group">
            <label for="startDate" class="form-label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                Start Date
            </label>
            <input 
                type="date" 
                id="startDate" 
                name="startDate" 
                class="form-input" 
                data-date-start
                required
            >
            <span class="form-hint">Trip departure date</span>
        </div>
        
        <div class="date-picker__divider">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </div>
        
        <div class="form-group">
            <label for="endDate" class="form-label">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="16" y1="2" x2="16" y2="6"></line>
                    <line x1="8" y1="2" x2="8" y2="6"></line>
                    <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
                End Date
            </label>
            <input 
                type="date" 
                id="endDate" 
                name="endDate" 
                class="form-input" 
                data-date-end
                required
            >
            <span class="form-hint">Trip return date</span>
        </div>
    </div>
    
    <div class="date-picker__summary" id="datePickerSummary">
        <!-- Dynamically populated -->
    </div>
</div>

<style>
    /* Date Picker Styles */
    .date-picker {
        background-color: var(--color-white);
        border-radius: var(--radius-xl);
        padding: var(--space-8);
        box-shadow: var(--shadow-lg);
    }
    
    .date-picker__header {
        text-align: center;
        margin-bottom: var(--space-8);
    }
    
    .date-picker__title {
        font-family: var(--font-secondary);
        font-size: var(--text-2xl);
        font-weight: var(--font-bold);
        color: var(--color-gray-800);
        margin-bottom: var(--space-2);
    }
    
    .date-picker__subtitle {
        color: var(--color-gray-500);
        margin: 0;
    }
    
    .date-picker__inputs {
        display: flex;
        align-items: flex-start;
        gap: var(--space-4);
        justify-content: center;
        flex-wrap: wrap;
    }
    
    .date-picker__inputs .form-group {
        flex: 1;
        min-width: 200px;
        max-width: 280px;
    }
    
    .date-picker__inputs .form-label {
        display: flex;
        align-items: center;
        gap: var(--space-2);
    }
    
    .date-picker__inputs .form-input {
        padding: var(--space-4);
        font-size: var(--text-lg);
    }
    
    .date-picker__divider {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-gray-400);
        padding-top: var(--space-8);
    }
    
    @media (max-width: 640px) {
        .date-picker__divider {
            transform: rotate(90deg);
            padding: var(--space-2) 0;
        }
    }
    
    /* Date Summary */
    .date-picker__summary {
        margin-top: var(--space-8);
        padding: var(--space-6);
        background-color: var(--color-primary-50);
        border-radius: var(--radius-lg);
        text-align: center;
        display: none;
    }
    
    .date-picker__summary.is-visible {
        display: block;
    }
    
    .date-picker__summary-text {
        font-size: var(--text-lg);
        color: var(--color-gray-800);
        margin: 0;
    }
    
    .date-picker__summary-duration {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        margin-top: var(--space-2);
        font-weight: var(--font-semibold);
        color: var(--color-primary);
    }
</style>

<script>
    /**
     * DateRangePicker Component
     */
    class DateRangePicker {
        constructor(containerId) {
            this.container = document.getElementById(containerId);
            this.startInput = this.container.querySelector('[data-date-start]');
            this.endInput = this.container.querySelector('[data-date-end]');
            this.summary = this.container.querySelector('#datePickerSummary');
            
            this.init();
        }
        
        init() {
            // Set minimum date to today
            const today = new Date().toISOString().split('T')[0];
            this.startInput.min = today;
            this.endInput.min = today;
            
            // Event listeners
            this.startInput.addEventListener('change', () => this.onStartDateChange());
            this.endInput.addEventListener('change', () => this.onEndDateChange());
        }
        
        onStartDateChange() {
            const startDate = this.startInput.value;
            
            // Set end date minimum to start date
            this.endInput.min = startDate;
            
            // If end date is before start date, reset it
            if (this.endInput.value && this.endInput.value < startDate) {
                this.endInput.value = '';
            }
            
            this.updateSummary();
        }
        
        onEndDateChange() {
            this.updateSummary();
        }
        
        updateSummary() {
            if (this.startInput.value && this.endInput.value) {
                const start = new Date(this.startInput.value);
                const end = new Date(this.endInput.value);
                const days = Math.ceil((end - start) / (1000 * 60 * 60 * 24));
                const nights = days;
                
                const formatOptions = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
                const startFormatted = start.toLocaleDateString('en-US', formatOptions);
                const endFormatted = end.toLocaleDateString('en-US', formatOptions);
                
                this.summary.innerHTML = `
                    <p class="date-picker__summary-text">
                        ${startFormatted} → ${endFormatted}
                    </p>
                    <span class="date-picker__summary-duration">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M12 6v6l4 2"></path>
                        </svg>
                        ${nights} night${nights !== 1 ? 's' : ''} trip
                    </span>
                `;
                this.summary.classList.add('is-visible');
            } else {
                this.summary.classList.remove('is-visible');
            }
        }
        
        getDates() {
            return {
                startDate: this.startInput.value,
                endDate: this.endInput.value
            };
        }
        
        isValid() {
            return this.startInput.value && this.endInput.value && 
                   this.startInput.value <= this.endInput.value;
        }
    }
</script>
