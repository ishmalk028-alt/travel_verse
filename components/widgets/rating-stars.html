<!-- 
    Rating Stars Widget
    Trip Planner Website
    
    Usage: Display star ratings (1-5)
-->

<!-- Basic Rating Display -->
<div class="rating" data-rating="4.5">
    <div class="rating__stars">
        <span class="rating__star is-filled">★</span>
        <span class="rating__star is-filled">★</span>
        <span class="rating__star is-filled">★</span>
        <span class="rating__star is-filled">★</span>
        <span class="rating__star is-half">★</span>
    </div>
    <span class="rating__value">4.5</span>
</div>

<!-- Rating with Review Count -->
<div class="rating rating--with-count" data-rating="4">
    <div class="rating__stars">
        <span class="rating__star is-filled">★</span>
        <span class="rating__star is-filled">★</span>
        <span class="rating__star is-filled">★</span>
        <span class="rating__star is-filled">★</span>
        <span class="rating__star">★</span>
    </div>
    <span class="rating__value">4.0</span>
    <span class="rating__count">(256 reviews)</span>
</div>

<!-- Hotel Star Rating -->
<div class="rating rating--hotel" data-star-rating="5">
    <span class="rating__star is-filled">★</span>
    <span class="rating__star is-filled">★</span>
    <span class="rating__star is-filled">★</span>
    <span class="rating__star is-filled">★</span>
    <span class="rating__star is-filled">★</span>
    <span class="rating__label">Luxury</span>
</div>

<!-- Interactive Rating Input -->
<div class="rating-input" data-rating-input>
    <span class="rating-input__star" data-value="1">★</span>
    <span class="rating-input__star" data-value="2">★</span>
    <span class="rating-input__star" data-value="3">★</span>
    <span class="rating-input__star" data-value="4">★</span>
    <span class="rating-input__star" data-value="5">★</span>
    <input type="hidden" name="rating" value="0">
</div>

<style>
    /* Rating Display */
    .rating {
        display: inline-flex;
        align-items: center;
        gap: var(--space-1);
    }
    
    .rating__stars {
        display: inline-flex;
        gap: 2px;
    }
    
    .rating__star {
        color: var(--color-gray-300);
        font-size: var(--text-base);
        line-height: 1;
    }
    
    .rating__star.is-filled {
        color: var(--color-accent);
    }
    
    .rating__star.is-half {
        position: relative;
        color: var(--color-gray-300);
    }
    
    .rating__star.is-half::before {
        content: '★';
        position: absolute;
        left: 0;
        color: var(--color-accent);
        width: 50%;
        overflow: hidden;
    }
    
    .rating__value {
        font-weight: var(--font-semibold);
        color: var(--color-gray-800);
        margin-left: var(--space-1);
    }
    
    .rating__count {
        color: var(--color-gray-500);
        font-size: var(--text-sm);
    }
    
    /* Rating Sizes */
    .rating--sm .rating__star {
        font-size: var(--text-sm);
    }
    
    .rating--lg .rating__star {
        font-size: var(--text-xl);
    }
    
    /* Hotel Star Rating */
    .rating--hotel {
        gap: 2px;
    }
    
    .rating--hotel .rating__star {
        color: var(--color-accent);
    }
    
    .rating--hotel .rating__label {
        margin-left: var(--space-2);
        font-size: var(--text-xs);
        font-weight: var(--font-medium);
        text-transform: uppercase;
        color: var(--color-gray-500);
        letter-spacing: 0.5px;
    }
    
    /* Interactive Rating Input */
    .rating-input {
        display: inline-flex;
        gap: 4px;
        cursor: pointer;
    }
    
    .rating-input__star {
        font-size: var(--text-2xl);
        color: var(--color-gray-300);
        transition: all var(--transition-fast);
    }
    
    .rating-input__star:hover,
    .rating-input__star.is-hovered {
        color: var(--color-accent);
        transform: scale(1.1);
    }
    
    .rating-input__star.is-selected {
        color: var(--color-accent);
    }
</style>

<script>
    /**
     * Rating Display Utility
     */
    const RatingStars = {
        /**
         * Create rating stars HTML
         * @param {number} rating - Rating value (0-5)
         * @param {object} options 
         * @returns {string}
         */
        create(rating, options = {}) {
            const {
                showValue = true,
                showCount = false,
                count = 0,
                size = 'md'
            } = options;
            
            const fullStars = Math.floor(rating);
            const hasHalf = rating % 1 >= 0.5;
            const emptyStars = 5 - fullStars - (hasHalf ? 1 : 0);
            
            let stars = '';
            
            for (let i = 0; i < fullStars; i++) {
                stars += '<span class="rating__star is-filled">★</span>';
            }
            
            if (hasHalf) {
                stars += '<span class="rating__star is-half">★</span>';
            }
            
            for (let i = 0; i < emptyStars; i++) {
                stars += '<span class="rating__star">★</span>';
            }
            
            let html = `<div class="rating rating--${size}" data-rating="${rating}">`;
            html += `<div class="rating__stars">${stars}</div>`;
            
            if (showValue) {
                html += `<span class="rating__value">${rating.toFixed(1)}</span>`;
            }
            
            if (showCount && count > 0) {
                html += `<span class="rating__count">(${count} reviews)</span>`;
            }
            
            html += '</div>';
            
            return html;
        },
        
        /**
         * Create hotel star rating
         * @param {number} stars - Number of stars (1-5)
         * @returns {string}
         */
        createHotelRating(stars) {
            const labels = {
                1: 'Budget',
                2: 'Economy',
                3: 'Standard',
                4: 'Superior',
                5: 'Luxury'
            };
            
            let starsHtml = '';
            for (let i = 0; i < stars; i++) {
                starsHtml += '<span class="rating__star is-filled">★</span>';
            }
            
            return `
                <div class="rating rating--hotel" data-star-rating="${stars}">
                    ${starsHtml}
                    <span class="rating__label">${labels[stars] || ''}</span>
                </div>
            `;
        },
        
        /**
         * Initialize interactive rating inputs
         */
        initInteractive() {
            document.querySelectorAll('[data-rating-input]').forEach(container => {
                const stars = container.querySelectorAll('.rating-input__star');
                const input = container.querySelector('input[type="hidden"]');
                
                stars.forEach(star => {
                    star.addEventListener('mouseenter', () => {
                        const value = parseInt(star.dataset.value);
                        stars.forEach(s => {
                            s.classList.toggle('is-hovered', parseInt(s.dataset.value) <= value);
                        });
                    });
                    
                    star.addEventListener('click', () => {
                        const value = parseInt(star.dataset.value);
                        input.value = value;
                        stars.forEach(s => {
                            s.classList.toggle('is-selected', parseInt(s.dataset.value) <= value);
                        });
                    });
                });
                
                container.addEventListener('mouseleave', () => {
                    stars.forEach(s => s.classList.remove('is-hovered'));
                });
            });
        }
    };
    
    // Initialize on DOM ready
    document.addEventListener('DOMContentLoaded', () => {
        RatingStars.initInteractive();
    });
</script>
