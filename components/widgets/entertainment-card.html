<!-- 
    Entertainment Card Widget
    Trip Planner Website
    
    Usage: Use as template for displaying entertainment/activity cards
-->

<!-- Entertainment Card Template -->
<div class="card card--entertainment card--selectable" data-entertainment-id="{{id}}">
    <img src="{{imageUrl}}" alt="{{name}}" class="card__image">
    <div class="card__body">
        <span class="card__type">{{type}}</span>
        <h3 class="card__title">{{name}}</h3>
        
        <div class="card__meta">
            <span class="card__duration">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                {{duration}}
            </span>
            <span class="card__rating-value">
                <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                </svg>
                {{rating}}
            </span>
        </div>
        
        <p class="card__text">{{description}}</p>
        
        <div class="card__footer">
            <div class="card__price">
                {{#if price}}
                    ${{price}}
                {{else}}
                    <span class="card__free-badge">Free</span>
                {{/if}}
            </div>
            <button class="btn btn--primary btn--sm">
                {{#if requiresBooking}}
                    Book Now
                {{else}}
                    Add to Trip
                {{/if}}
            </button>
        </div>
    </div>
</div>

<style>
    /* Entertainment Card Additional Styles */
    .card--entertainment .card__image {
        height: 180px;
    }
    
    .card--entertainment .card__type {
        display: inline-block;
        font-size: var(--text-xs);
        font-weight: var(--font-semibold);
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--color-secondary);
        margin-bottom: var(--space-2);
    }
    
    .card--entertainment .card__title {
        font-size: var(--text-lg);
        margin-bottom: var(--space-2);
    }
    
    .card--entertainment .card__meta {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        margin-bottom: var(--space-3);
    }
    
    .card--entertainment .card__duration,
    .card--entertainment .card__rating-value {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        font-size: var(--text-sm);
        color: var(--color-gray-500);
    }
    
    .card--entertainment .card__rating-value svg {
        color: var(--color-accent);
    }
    
    .card--entertainment .card__text {
        font-size: var(--text-sm);
        color: var(--color-gray-600);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-bottom: var(--space-4);
    }
    
    .card--entertainment .card__footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .card--entertainment .card__price {
        font-family: var(--font-secondary);
        font-size: var(--text-xl);
        font-weight: var(--font-bold);
        color: var(--color-primary);
    }
    
    .card--entertainment .card__free-badge {
        display: inline-block;
        padding: var(--space-1) var(--space-3);
        background-color: var(--color-success);
        color: var(--color-white);
        font-size: var(--text-sm);
        font-weight: var(--font-semibold);
        border-radius: var(--radius-full);
    }
</style>
