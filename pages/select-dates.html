<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Dates - TripPlanner</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/main.css">
    
    <style>
        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .page__header {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-600) 100%);
            padding: var(--space-8) 0;
            color: var(--color-white);
        }
        
        .page__title {
            font-family: var(--font-secondary);
            font-size: var(--text-3xl);
            font-weight: var(--font-bold);
            margin-bottom: var(--space-2);
        }
        
        .page__subtitle {
            opacity: 0.9;
        }
        
        .page__content {
            flex: 1;
            padding: var(--space-12) 0;
            background-color: var(--color-gray-50);
        }
        
        /* Stepper Styles */
        .stepper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            padding: var(--space-4) 0;
            margin-bottom: var(--space-8);
            flex-wrap: wrap;
            gap: var(--space-2);
        }
        
        .stepper__step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            min-width: 80px;
        }
        
        .stepper__step-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-white);
            border: 2px solid var(--color-gray-300);
            border-radius: var(--radius-full);
            color: var(--color-gray-400);
            margin-bottom: var(--space-2);
            transition: all var(--transition-fast);
        }
        
        .stepper__step-icon svg {
            width: 24px;
            height: 24px;
        }
        
        .stepper__step-label {
            font-size: var(--text-xs);
            font-weight: var(--font-medium);
            color: var(--color-gray-500);
        }
        
        .stepper__step.is-active .stepper__step-icon {
            background-color: var(--color-primary);
            border-color: var(--color-primary);
            color: var(--color-white);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
        }
        
        .stepper__step.is-active .stepper__step-label {
            color: var(--color-primary);
            font-weight: var(--font-semibold);
        }
        
        .stepper__step.is-completed .stepper__step-icon {
            background-color: var(--color-success);
            border-color: var(--color-success);
            color: var(--color-white);
        }
        
        /* Date Picker Section */
        .date-section {
            max-width: 700px;
            margin: 0 auto;
        }
        
        .date-picker {
            background-color: var(--color-white);
            border-radius: var(--radius-2xl);
            padding: var(--space-10);
            box-shadow: var(--shadow-lg);
        }
        
        .date-picker__header {
            text-align: center;
            margin-bottom: var(--space-8);
        }
        
        .date-picker__title {
            font-family: var(--font-secondary);
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            color: var(--color-gray-800);
            margin-bottom: var(--space-2);
        }
        
        .date-picker__subtitle {
            color: var(--color-gray-500);
        }
        
        .date-picker__inputs {
            display: flex;
            gap: var(--space-6);
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: var(--space-8);
        }
        
        .date-picker__group {
            flex: 1;
            min-width: 200px;
            max-width: 280px;
        }
        
        .date-picker__label {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-weight: var(--font-medium);
            color: var(--color-gray-700);
            margin-bottom: var(--space-2);
        }
        
        .date-picker__input {
            width: 100%;
            padding: var(--space-4);
            font-size: var(--text-lg);
            border: 2px solid var(--color-gray-200);
            border-radius: var(--radius-lg);
            transition: all var(--transition-fast);
        }
        
        .date-picker__input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        
        .date-picker__divider {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-gray-400);
            padding-top: var(--space-8);
        }
        
        /* Summary */
        .date-picker__summary {
            padding: var(--space-6);
            background-color: var(--color-primary-50);
            border-radius: var(--radius-lg);
            text-align: center;
            display: none;
        }
        
        .date-picker__summary.is-visible {
            display: block;
        }
        
        .date-picker__summary-text {
            font-size: var(--text-lg);
            color: var(--color-gray-800);
            margin-bottom: var(--space-2);
        }
        
        .date-picker__summary-duration {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            font-weight: var(--font-semibold);
            color: var(--color-primary);
        }
        
        /* Actions */
        .page__actions {
            display: flex;
            justify-content: space-between;
            gap: var(--space-4);
            margin-top: var(--space-8);
            padding-top: var(--space-8);
            border-top: 1px solid var(--color-gray-200);
        }
        
        .page__actions .btn {
            min-width: 150px;
        }
        
        @media (max-width: 640px) {
            .date-picker__divider {
                transform: rotate(90deg);
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- Header -->
        <header class="header is-scrolled">
            <div class="container">
                <div class="header__inner">
                    <a href="../index.html" class="header__logo">
                        <svg class="header__logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="32" height="32">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                            <line x1="12" y1="22.08" x2="12" y2="12"></line>
                        </svg>
                        <span class="header__logo-text">TripPlanner</span>
                    </a>
                    <a href="../index.html" class="btn btn--outline">Back to Home</a>
                </div>
            </div>
        </header>

        <!-- Page Header -->
        <div class="page__header">
            <div class="container">
                <h1 class="page__title">Plan Your Trip</h1>
                <p class="page__subtitle">Let's start by selecting your travel dates</p>
            </div>
        </div>

        <!-- Page Content -->
        <main class="page__content">
            <div class="container">
                <!-- Progress Stepper -->
                <div class="stepper">
                    <div class="stepper__step is-active">
                        <div class="stepper__step-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                        </div>
                        <span class="stepper__step-label">Dates</span>
                    </div>
                    
                    <div class="stepper__step">
                        <div class="stepper__step-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="2" y1="12" x2="22" y2="12"></line>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                            </svg>
                        </div>
                        <span class="stepper__step-label">Countries</span>
                    </div>
                    
                    <div class="stepper__step">
                        <div class="stepper__step-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                        </div>
                        <span class="stepper__step-label">Cities</span>
                    </div>
                    
                    <div class="stepper__step">
                        <div class="stepper__step-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                                <polyline points="9 22 9 12 15 12 15 22"></polyline>
                            </svg>
                        </div>
                        <span class="stepper__step-label">Hotels</span>
                    </div>
                    
                    <div class="stepper__step">
                        <div class="stepper__step-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                            </svg>
                        </div>
                        <span class="stepper__step-label">Activities</span>
                    </div>
                    
                    <div class="stepper__step">
                        <div class="stepper__step-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                                <line x1="1" y1="10" x2="23" y2="10"></line>
                            </svg>
                        </div>
                        <span class="stepper__step-label">Checkout</span>
                    </div>
                </div>

                <!-- Date Picker Section -->
                <div class="date-section">
                    <div class="date-picker">
                        <div class="date-picker__header">
                            <h2 class="date-picker__title">When are you traveling?</h2>
                            <p class="date-picker__subtitle">Select your trip start and end dates</p>
                        </div>
                        
                        <div class="date-picker__inputs">
                            <div class="date-picker__group">
                                <label for="startDate" class="date-picker__label">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <polyline points="12 6 12 12 16 14"></polyline>
                                    </svg>
                                    Departure Date
                                </label>
                                <input type="date" id="startDate" class="date-picker__input" required>
                            </div>
                            
                            <div class="date-picker__divider">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24">
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                    <polyline points="12 5 19 12 12 19"></polyline>
                                </svg>
                            </div>
                            
                            <div class="date-picker__group">
                                <label for="endDate" class="date-picker__label">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <polyline points="12 6 12 12 16 14"></polyline>
                                    </svg>
                                    Return Date
                                </label>
                                <input type="date" id="endDate" class="date-picker__input" required>
                            </div>
                        </div>
                        
                        <div class="date-picker__summary" id="dateSummary">
                            <!-- Populated by JS -->
                        </div>
                        
                        <div class="page__actions">
                            <a href="../index.html" class="btn btn--outline">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                    <line x1="19" y1="12" x2="5" y2="12"></line>
                                    <polyline points="12 19 5 12 12 5"></polyline>
                                </svg>
                                Back
                            </a>
                            <button type="button" class="btn btn--primary" id="continueBtn" disabled>
                                Continue
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                    <polyline points="12 5 19 12 12 19"></polyline>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Date picker logic
        const startDateInput = document.getElementById('startDate');
        const endDateInput = document.getElementById('endDate');
        const dateSummary = document.getElementById('dateSummary');
        const continueBtn = document.getElementById('continueBtn');
        
        // Set minimum date to today
        const today = new Date().toISOString().split('T')[0];
        startDateInput.min = today;
        endDateInput.min = today;
        
        function updateSummary() {
            if (startDateInput.value && endDateInput.value) {
                const start = new Date(startDateInput.value);
                const end = new Date(endDateInput.value);
                const days = Math.ceil((end - start) / (1000 * 60 * 60 * 24));
                const nights = days;
                
                if (days >= 0) {
                    const formatOptions = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
                    const startFormatted = start.toLocaleDateString('en-US', formatOptions);
                    const endFormatted = end.toLocaleDateString('en-US', formatOptions);
                    
                    dateSummary.innerHTML = `
                        <p class="date-picker__summary-text">
                            ${startFormatted} → ${endFormatted}
                        </p>
                        <span class="date-picker__summary-duration">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                                <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"></path>
                            </svg>
                            ${nights} night${nights !== 1 ? 's' : ''} trip
                        </span>
                    `;
                    dateSummary.classList.add('is-visible');
                    continueBtn.disabled = false;
                } else {
                    dateSummary.classList.remove('is-visible');
                    continueBtn.disabled = true;
                }
            } else {
                dateSummary.classList.remove('is-visible');
                continueBtn.disabled = true;
            }
        }
        
        startDateInput.addEventListener('change', () => {
            endDateInput.min = startDateInput.value;
            if (endDateInput.value && endDateInput.value < startDateInput.value) {
                endDateInput.value = '';
            }
            updateSummary();
        });
        
        endDateInput.addEventListener('change', updateSummary);
        
        // Continue button
        continueBtn.addEventListener('click', () => {
            // Save to localStorage
            localStorage.setItem('tripDates', JSON.stringify({
                startDate: startDateInput.value,
                endDate: endDateInput.value
            }));
            
            // Navigate to next page
            window.location.href = 'select-countries.html';
        });
        
        // Load saved dates if available
        const savedDates = localStorage.getItem('tripDates');
        if (savedDates) {
            const dates = JSON.parse(savedDates);
            startDateInput.value = dates.startDate;
            endDateInput.value = dates.endDate;
            updateSummary();
        }
    </script>
</body>
</html>
