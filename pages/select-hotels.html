<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Hotels — TripPlanner</title>
  <meta name="description" content="Step 4: Browse and book hotels for each city in your itinerary." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body class="planner-page">

<header class="site-header">
  <div class="container">
    <div class="site-header__inner">
      <a href="../index.html" class="site-logo">
        <div class="site-logo__icon">✈️</div>
        <span class="site-logo__text">TripPlanner</span>
      </a>
      <div class="trip-progress">
        <span class="text-sm text-secondary">Step 4 of 7</span>
        <div class="trip-progress__bar">
          <div class="trip-progress__fill" style="width:57%"></div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="planner-stepper-bar">
  <div class="container"><div id="stepper"></div></div>
</div>

<main>
  <div class="container">
    <div class="planner-layout">
      <div class="planner-main">
        <div class="page-header">
          <button class="page-header__back" onclick="history.back()">← Back</button>
          <div class="section-tag"><span>🏨</span> Step 4</div>
          <h1 class="page-header__title">Choose Your<br><span class="gradient-text">Hotels</span></h1>
          <p class="page-header__subtitle">Select one hotel per city. Filter by stars and price.</p>
        </div>

        <div id="hotels-container">
          <!-- City sections injected by JS -->
        </div>
      </div>

      <aside class="planner-sidebar">
        <div id="expense-sidebar"></div>
        <div class="card mt-4">
          <div class="card__body">
            <h3 class="text-sm font-bold mb-3">🏨 Hotel Selections</h3>
            <div id="hotels-summary">
              <p class="text-sm text-muted">No hotels selected yet.</p>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <div class="step-nav">
      <button class="btn btn--ghost" onclick="history.back()">← Back</button>
      <button class="btn btn--primary btn--lg" id="next-btn" disabled>
        Continue to Activities →
      </button>
    </div>
  </div>
</main>

<div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

<script type="module">
  import { tripPlannerVM } from '../js/viewmodels/TripPlannerVM.js';
  import { ExpenseCalculatorVM } from '../js/viewmodels/ExpenseCalculatorVM.js';
  import { ValidationService } from '../js/services/ValidationService.js';
  import { renderStepper } from '../js/app.js';
  import { showToast } from '../js/utils/helpers.js';
  import { formatCurrency, truncate } from '../js/utils/formatters.js';

  const expenseVM = new ExpenseCalculatorVM();
  expenseVM.renderSidebar(document.getElementById('expense-sidebar'));
  renderStepper(4, document.getElementById('stepper'));

  const cities    = tripPlannerVM.trip.cities;
  const container = document.getElementById('hotels-container');
  const nextBtn   = document.getElementById('next-btn');

  if (!cities.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state__icon">🏙️</div>
        <div class="empty-state__title">No cities selected</div>
        <p class="text-secondary mb-6">Go back and select cities first.</p>
        <a href="select-cities.html" class="btn btn--primary">← Select Cities</a>
      </div>`;
  } else {
    loadAllHotels();
  }

  const cityHotels = {}; // cityId -> hotels[]

  async function loadAllHotels() {
    for (const city of cities) {
      const section = document.createElement('div');
      section.className = 'mb-10';
      section.id = `hotel-section-${city.id}`;

      const country = tripPlannerVM.trip.countries.find(c => c.id === city.countryId);

      section.innerHTML = `
        <div class="flex items-center gap-3 mb-4 flex-wrap">
          <span class="text-2xl">${country?.flag || '🏙️'}</span>
          <h2 class="text-xl font-bold">${city.name}</h2>
          <span class="badge badge--primary">${city.nights} nights</span>
          <span class="text-sm text-muted ml-auto">Select 1 hotel</span>
        </div>
        <!-- Sort/filter row -->
        <div class="filter-bar mb-4">
          <select class="form-select" id="sort-${city.id}" style="max-width:180px" aria-label="Sort hotels">
            <option value="">Sort by</option>
            <option value="price_asc">Price: Low to High</option>
            <option value="price_desc">Price: High to Low</option>
            <option value="rating">Highest Rated</option>
          </select>
          <button class="filter-chip filter-chip--active" data-stars="0" data-city="${city.id}">All Stars</button>
          <button class="filter-chip" data-stars="3" data-city="${city.id}">⭐⭐⭐</button>
          <button class="filter-chip" data-stars="4" data-city="${city.id}">⭐⭐⭐⭐</button>
          <button class="filter-chip" data-stars="5" data-city="${city.id}">⭐⭐⭐⭐⭐</button>
        </div>
        <div class="card-grid" id="hotels-grid-${city.id}">
          <div class="skeleton" style="height:300px;border-radius:var(--radius-xl)"></div>
          <div class="skeleton" style="height:300px;border-radius:var(--radius-xl)"></div>
        </div>`;
      container.appendChild(section);

      try {
        const hotels = await tripPlannerVM.loadHotels(city.id);
        cityHotels[city.id] = hotels;
        renderHotelsGrid(hotels, city, `hotels-grid-${city.id}`);
        setupFilters(city);
      } catch {
        document.getElementById(`hotels-grid-${city.id}`).innerHTML =
          '<p class="text-secondary">Failed to load hotels.</p>';
      }
    }
    updateNextBtn();
  }

  function renderHotelsGrid(hotels, city, gridId) {
    const grid = document.getElementById(gridId);
    if (!hotels.length) {
      grid.innerHTML = '<p class="text-secondary p-4">No hotels match your filter.</p>';
      return;
    }
    const selectedHotel = tripPlannerVM.getHotelForCity(city.id);
    grid.innerHTML = hotels.map(h => {
      const isSelected  = selectedHotel?.id === h.id;
      const nightsCost  = h.pricePerNight * city.nights;
      const stars = '★'.repeat(h.starRating) + '☆'.repeat(5 - h.starRating);
      return `
        <div class="card card--selectable ${isSelected ? 'card--selected' : ''}"
             id="hotel-card-${h.id}" data-hotel-id="${h.id}" data-city-id="${city.id}"
             role="button" tabindex="0" aria-pressed="${isSelected}">
          <div class="card__image-wrapper">
            <img src="${h.imageUrl}" alt="${h.name}" class="card__image" loading="lazy"
                 onerror="this.src='https://images.unsplash.com/photo-1566073771259-6a8506099945?w=400&q=60'" />
            <div class="card__badge">${h.starRating}★ Hotel</div>
            ${isSelected ? `<div style="position:absolute;top:var(--space-3);left:var(--space-3);width:28px;height:28px;background:var(--gradient-primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2;box-shadow:0 4px 10px rgba(99,102,241,.4)">✓</div>` : ''}
          </div>
          <div class="card__body">
            <div class="stars mb-2" aria-label="${h.starRating} stars">${stars}</div>
            <h3 class="card__title">${h.name}</h3>
            <p class="card__text">${truncate(h.description, 80)}</p>
            <div class="amenity-list mt-3">
              ${h.amenities.slice(0, 4).map(a => `<span class="amenity-chip">${a}</span>`).join('')}
            </div>
            <div class="flex items-center gap-2 mt-3">
              <span class="text-accent font-bold text-sm">${h.rating}⭐</span>
              <span class="text-muted text-xs">(${h.reviewCount.toLocaleString()} reviews)</span>
            </div>
          </div>
          <div class="card__footer">
            <div class="card__price">
              <span class="card__price-label">Per night</span>
              <span class="card__price-value">${formatCurrency(h.pricePerNight)}<span> / night</span></span>
              <span class="text-xs text-muted">${formatCurrency(nightsCost)} for ${city.nights} nights</span>
            </div>
            <button class="btn btn--sm ${isSelected ? 'btn--success' : 'btn--primary'}" data-select="${h.id}" data-city="${city.id}">
              ${isSelected ? '✓ Booked' : 'Select'}
            </button>
          </div>
        </div>`;
    }).join('');

    grid.querySelectorAll('[data-select]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const hotelId = parseInt(btn.dataset.select);
        const cityId  = parseInt(btn.dataset.city);
        const hotel   = cityHotels[cityId]?.find(h => h.id === hotelId);
        if (!hotel) return;
        tripPlannerVM.selectHotel(cityId, hotel);
        showToast(`${hotel.name} selected!`, 'success', 'Hotel Booked');
        renderHotelsGrid(cityHotels[cityId], city, gridId);
        updateNextBtn();
        updateHotelsSummary();
        expenseVM.recalculate();
        expenseVM.renderSidebar(document.getElementById('expense-sidebar'));
      });
    });
  }

  function setupFilters(city) {
    const sortEl = document.getElementById(`sort-${city.id}`);
    sortEl?.addEventListener('change', () => {
      const hotels = sortHotels(cityHotels[city.id] || [], sortEl.value);
      renderHotelsGrid(hotels, city, `hotels-grid-${city.id}`);
    });

    document.querySelectorAll(`[data-city="${city.id}"][data-stars]`).forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll(`[data-city="${city.id}"][data-stars]`).forEach(b => b.classList.remove('filter-chip--active'));
        btn.classList.add('filter-chip--active');
        const stars  = parseInt(btn.dataset.stars);
        const hotels = stars === 0
          ? cityHotels[city.id] || []
          : (cityHotels[city.id] || []).filter(h => h.starRating === stars);
        renderHotelsGrid(hotels, city, `hotels-grid-${city.id}`);
      });
    });
  }

  function sortHotels(hotels, sortBy) {
    const arr = [...hotels];
    if (sortBy === 'price_asc')  arr.sort((a, b) => a.pricePerNight - b.pricePerNight);
    if (sortBy === 'price_desc') arr.sort((a, b) => b.pricePerNight - a.pricePerNight);
    if (sortBy === 'rating')     arr.sort((a, b) => b.rating - a.rating);
    return arr;
  }

  function updateHotelsSummary() {
    const hotels = tripPlannerVM.trip.hotels;
    const sumEl  = document.getElementById('hotels-summary');
    if (!hotels.length) {
      sumEl.innerHTML = '<p class="text-sm text-muted">No hotels selected yet.</p>';
      return;
    }
    sumEl.innerHTML = hotels.map(h => `
      <div class="summary-item">
        <div class="summary-item__icon">🏨</div>
        <div class="summary-item__content">
          <div class="summary-item__title text-sm">${h.hotel.name}</div>
          <div class="summary-item__detail">${h.nights} nights</div>
        </div>
        <div class="summary-item__price text-sm">${formatCurrency(h.hotel.pricePerNight * h.nights)}</div>
      </div>`).join('');
  }

  function updateNextBtn() {
    const errors = ValidationService.validateHotels(
      tripPlannerVM.trip.hotels,
      tripPlannerVM.trip.cities
    );
    nextBtn.disabled = errors.length > 0;
    updateHotelsSummary();
    const missingCount = tripPlannerVM.trip.cities.length - tripPlannerVM.trip.hotels.length;
    nextBtn.textContent = errors.length
      ? `${missingCount} hotel${missingCount !== 1 ? 's' : ''} missing`
      : 'Continue to Activities →';
  }

  nextBtn.addEventListener('click', () => { window.location.href = 'select-entertainment.html'; });
</script>
</body>
</html>
