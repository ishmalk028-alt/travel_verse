<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Hotels - TripPlanner</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/main.css">
    
    <style>
        .page { min-height: 100vh; display: flex; flex-direction: column; }
        .page__header { background: var(--color-white); padding: var(--space-8) 0; color: var(--color-text-high); }
        .page__title { font-family: var(--font-secondary); font-size: var(--text-3xl); font-weight: var(--font-bold); margin-bottom: var(--space-2); }
        .page__subtitle { opacity: 0.9; }
        .page__content { flex: 1; padding: var(--space-12) 0; background-color: var(--color-gray-50); }
        
        /* Stepper */
        .stepper { display: flex; justify-content: center; align-items: flex-start; padding: var(--space-4) 0; margin-bottom: var(--space-8); flex-wrap: wrap; gap: var(--space-2); }
        .stepper__step { display: flex; flex-direction: column; align-items: center; min-width: 80px; }
        .stepper__step-icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background-color: var(--color-white); border: 2px solid var(--color-gray-300); border-radius: var(--radius-full); color: var(--color-gray-400); margin-bottom: var(--space-2); }
        .stepper__step-icon svg { width: 24px; height: 24px; }
        .stepper__step-label { font-size: var(--text-xs); font-weight: var(--font-medium); color: var(--color-gray-500); }
        .stepper__step.is-active .stepper__step-icon { background-color: var(--color-primary); border-color: var(--color-primary); color: var(--color-white); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2); }
        .stepper__step.is-active .stepper__step-label { color: var(--color-primary); font-weight: var(--font-semibold); }
        .stepper__step.is-completed .stepper__step-icon { background-color: var(--color-success); border-color: var(--color-success); color: var(--color-white); }
        
        /* City Section */
        .city-section { margin-bottom: var(--space-12); }
        .city-section__header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-6); flex-wrap: wrap; gap: var(--space-4); }
        .city-section__title { font-family: var(--font-secondary); font-size: var(--text-2xl); font-weight: var(--font-bold); color: var(--color-gray-800); }
        .city-section__info { display: flex; align-items: center; gap: var(--space-2); color: var(--color-gray-600); }
        
        /* Hotels Grid */
        .hotels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--space-6); }
        
        /* Hotel Card */
        .hotel-card { background-color: var(--color-white); border-radius: var(--radius-xl); overflow: hidden; box-shadow: var(--shadow-md); cursor: pointer; transition: all var(--transition-normal); }
        .hotel-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-xl); }
        .hotel-card.is-selected { box-shadow: 0 0 0 3px var(--color-primary), var(--shadow-xl); }
        .hotel-card__image { width: 100%; height: 180px; object-fit: cover; }
        .hotel-card__body { padding: var(--space-5); }
        .hotel-card__header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: var(--space-3); }
        .hotel-card__name { font-family: var(--font-secondary); font-size: var(--text-lg); font-weight: var(--font-semibold); color: var(--color-gray-800); margin-bottom: var(--space-1); }
        .hotel-card__rating { display: flex; align-items: center; gap: var(--space-2); }
        .hotel-card__stars { color: var(--color-accent); font-size: var(--text-sm); }
        .hotel-card__review { font-size: var(--text-xs); color: var(--color-gray-500); }
        .hotel-card__price { text-align: right; }
        .hotel-card__price-value { font-family: var(--font-secondary); font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-primary); }
        .hotel-card__price-period { font-size: var(--text-xs); color: var(--color-gray-500); }
        .hotel-card__amenities { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-4); }
        .hotel-card__amenity { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--text-xs); color: var(--color-gray-600); background-color: var(--color-gray-100); padding: var(--space-1) var(--space-2); border-radius: var(--radius-full); }
        .hotel-card__footer { display: flex; justify-content: space-between; align-items: center; padding-top: var(--space-4); border-top: 1px solid var(--color-gray-100); }
        .hotel-card__total { font-size: var(--text-sm); color: var(--color-gray-600); }
        .hotel-card__total span { font-weight: var(--font-bold); color: var(--color-gray-800); }
        
        /* Expense Summary */
        .expense-summary { position: sticky; top: 100px; background-color: var(--color-white); border-radius: var(--radius-xl); padding: var(--space-6); box-shadow: var(--shadow-lg); }
        .expense-summary__title { font-family: var(--font-secondary); font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-gray-800); margin-bottom: var(--space-4); }
        .expense-summary__row { display: flex; justify-content: space-between; padding: var(--space-2) 0; }
        .expense-summary__label { color: var(--color-gray-600); }
        .expense-summary__value { font-weight: var(--font-semibold); color: var(--color-gray-800); }
        .expense-summary__divider { height: 1px; background-color: var(--color-gray-200); margin: var(--space-4) 0; }
        .expense-summary__total { display: flex; justify-content: space-between; padding: var(--space-2) 0; }
        .expense-summary__total .expense-summary__label { font-weight: var(--font-semibold); font-size: var(--text-lg); color: var(--color-gray-800); }
        .expense-summary__total .expense-summary__value { font-family: var(--font-secondary); font-size: var(--text-2xl); font-weight: var(--font-bold); color: var(--color-primary); }
        
        /* Layout */
        .page__layout { display: grid; grid-template-columns: 1fr 320px; gap: var(--space-8); align-items: start; }
        @media (max-width: 1024px) { .page__layout { grid-template-columns: 1fr; } .expense-summary { position: static; } }
        
        /* Actions */
        .page__actions { display: flex; justify-content: space-between; gap: var(--space-4); padding: var(--space-6); background-color: var(--color-white); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); margin-top: var(--space-8); }
        .page__actions .btn { min-width: 150px; }
    </style>
    <link rel="stylesheet" href="../css/pages/_professional.css">
</head>
<body class="theme-professional">
    <div class="page">
        <header class="header is-scrolled">
            <div class="container">
                <div class="header__inner">
                    <a href="../index.html" class="header__logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="32" height="32"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                        <span class="header__logo-text">TripPlanner</span>
                    </a>
                    <a href="../index.html" class="btn btn--outline">Back to Home</a>
                </div>
            </div>
        </header>

        <div class="page__header">
            <div class="container">
                <h1 class="page__title">Select Hotels</h1>
                <p class="page__subtitle">Choose accommodations for each city</p>
            </div>
        </div>

        <main class="page__content">
            <div class="container">
                <!-- Stepper -->
                <div class="stepper">
                    <div class="stepper__step is-completed"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span class="stepper__step-label">Dates</span></div>
                    <div class="stepper__step is-completed"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span class="stepper__step-label">Countries</span></div>
                    <div class="stepper__step is-completed"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span class="stepper__step-label">Cities</span></div>
                    <div class="stepper__step is-active"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div><span class="stepper__step-label">Hotels</span></div>
                    <div class="stepper__step"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></div><span class="stepper__step-label">Activities</span></div>
                    <div class="stepper__step"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg></div><span class="stepper__step-label">Checkout</span></div>
                </div>

                <div class="page__layout">
                    <div>
                        <div id="hotelsContainer"></div>
                        
                        <div class="page__actions">
                            <a href="select-cities.html" class="btn btn--outline">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                                Back
                            </a>
                            <button type="button" class="btn btn--primary" id="continueBtn" disabled>
                                Continue
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="expense-summary">
                        <h3 class="expense-summary__title">Trip Summary</h3>
                        <div id="expenseSummaryContent">
                            <div class="expense-summary__row">
                                <span class="expense-summary__label">Hotels</span>
                                <span class="expense-summary__value" id="totalHotels">$0</span>
                            </div>
                            <div class="expense-summary__divider"></div>
                            <div class="expense-summary__total">
                                <span class="expense-summary__label">Total</span>
                                <span class="expense-summary__value" id="grandTotal">$0</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/services/ApiService.js"></script>
    <script>
        const api = new ApiService();

        // Fallback hotels shown only if the API is unavailable.
        let hotelsByCityId = {
            1: [ // Paris
                { id: 1, name: 'Hotel Le Marais', stars: 4, price: 189, amenities: ['WiFi', 'Breakfast', 'Gym'], reviews: 245, image: 'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=400&h=200&fit=crop' },
                { id: 2, name: 'Grand Palace Hotel', stars: 5, price: 350, amenities: ['WiFi', 'Pool', 'Spa', 'Restaurant'], reviews: 512, image: 'https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?w=400&h=200&fit=crop' },
                { id: 3, name: 'Budget Inn Paris', stars: 3, price: 89, amenities: ['WiFi', 'Breakfast'], reviews: 128, image: 'https://images.unsplash.com/photo-1564501049412-61c2a3083791?w=400&h=200&fit=crop' }
            ],
            3: [ // Tokyo
                { id: 4, name: 'Shibuya Grand', stars: 4, price: 165, amenities: ['WiFi', 'Restaurant', 'Gym'], reviews: 389, image: 'https://images.unsplash.com/photo-1590490360182-c33d57733427?w=400&h=200&fit=crop' },
                { id: 5, name: 'Tokyo Imperial', stars: 5, price: 420, amenities: ['WiFi', 'Pool', 'Spa', 'Restaurant'], reviews: 723, image: 'https://images.unsplash.com/photo-1571896349842-33c89424de2d?w=400&h=200&fit=crop' }
            ],
            5: [ // Rome
                { id: 6, name: 'Roman Holiday Inn', stars: 4, price: 145, amenities: ['WiFi', 'Breakfast', 'Terrace'], reviews: 267, image: 'https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=400&h=200&fit=crop' },
                { id: 7, name: 'Colosseum View Hotel', stars: 4, price: 195, amenities: ['WiFi', 'Restaurant', 'Bar'], reviews: 445, image: 'https://images.unsplash.com/photo-1596394516093-501ba68a0ba6?w=400&h=200&fit=crop' }
            ],
            7: [ // New York
                { id: 8, name: 'Manhattan Suites', stars: 4, price: 225, amenities: ['WiFi', 'Gym', 'Business Center'], reviews: 567, image: 'https://images.unsplash.com/photo-1578683010236-d716f9a3f461?w=400&h=200&fit=crop' },
                { id: 9, name: 'Times Square Hotel', stars: 3, price: 159, amenities: ['WiFi', 'Breakfast'], reviews: 312, image: 'https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=400&h=200&fit=crop' }
            ]
        };
        
        // Default hotels for cities without specific data
        const defaultHotels = [
            { id: 100, name: 'City Center Hotel', stars: 4, price: 150, amenities: ['WiFi', 'Breakfast'], reviews: 200, image: 'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=400&h=200&fit=crop' },
            { id: 101, name: 'Luxury Resort', stars: 5, price: 300, amenities: ['WiFi', 'Pool', 'Spa'], reviews: 400, image: 'https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?w=400&h=200&fit=crop' },
            { id: 102, name: 'Budget Stay', stars: 3, price: 75, amenities: ['WiFi'], reviews: 150, image: 'https://images.unsplash.com/photo-1564501049412-61c2a3083791?w=400&h=200&fit=crop' }
        ];
        
        let selectedHotels = {}; // { cityId: hotelId }
        let selectedCities = [];
        
        const savedCities = localStorage.getItem('tripCities');
        if (savedCities) {
            selectedCities = JSON.parse(savedCities);
        } else {
            window.location.href = 'select-cities.html';
        }
        
        const hotelsContainer = document.getElementById('hotelsContainer');
        const continueBtn = document.getElementById('continueBtn');
        
        function getStars(count) {
            return '★'.repeat(count) + '☆'.repeat(5 - count);
        }
        
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[char]));
        }

        function normalizeHotel(hotel) {
            return {
                id: hotel.id,
                name: hotel.name,
                stars: Number(hotel.stars ?? hotel.star_rating ?? hotel.starRating ?? 3),
                price: Number(hotel.price ?? hotel.price_per_night ?? hotel.pricePerNight ?? 0),
                amenities: hotel.amenities || [],
                reviews: Number(hotel.reviews ?? hotel.review_count ?? hotel.reviewCount ?? 0),
                image: hotel.image || hotel.image_url || hotel.imageUrl || ''
            };
        }

        function renderHotels() {
            hotelsContainer.innerHTML = selectedCities.map(city => {
                let hotels = (hotelsByCityId[city.id] || defaultHotels.map((h, i) => ({ ...h, id: city.id * 1000 + i }))).map(normalizeHotel);
                return `
                    <div class="city-section">
                        <div class="city-section__header">
                            <h2 class="city-section__title">${escapeHtml(city.name)}</h2>
                            <div class="city-section__info">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                ${city.nights} night${city.nights > 1 ? 's' : ''}
                            </div>
                        </div>
                        <div class="hotels-grid">
                            ${hotels.map(hotel => `
                                <div class="hotel-card ${selectedHotels[city.id] === hotel.id ? 'is-selected' : ''}" 
                                     data-city-id="${city.id}" data-hotel-id="${hotel.id}" data-price="${hotel.price}" data-nights="${city.nights}">
                                    <img src="${escapeHtml(hotel.image)}" alt="${escapeHtml(hotel.name)}" class="hotel-card__image">
                                    <div class="hotel-card__body">
                                        <div class="hotel-card__header">
                                            <div>
                                                <h3 class="hotel-card__name">${escapeHtml(hotel.name)}</h3>
                                                <div class="hotel-card__rating">
                                                    <span class="hotel-card__stars">${getStars(hotel.stars)}</span>
                                                    <span class="hotel-card__review">(${hotel.reviews} reviews)</span>
                                                </div>
                                            </div>
                                            <div class="hotel-card__price">
                                                <div class="hotel-card__price-value">$${hotel.price}</div>
                                                <div class="hotel-card__price-period">per night</div>
                                            </div>
                                        </div>
                                        <div class="hotel-card__amenities">
                                            ${hotel.amenities.map(a => `<span class="hotel-card__amenity">${escapeHtml(a)}</span>`).join('')}
                                        </div>
                                        <div class="hotel-card__footer">
                                            <span class="hotel-card__total">Total: <span>$${hotel.price * city.nights}</span></span>
                                            <button class="btn btn--primary btn--sm">Select</button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
            
            document.querySelectorAll('.hotel-card').forEach(card => {
                card.addEventListener('click', () => {
                    const cityId = parseInt(card.dataset.cityId);
                    const hotelId = parseInt(card.dataset.hotelId);
                    selectHotel(cityId, hotelId);
                });
            });
        }
        
        function selectHotel(cityId, hotelId) {
            selectedHotels[cityId] = hotelId;
            updateUI();
        }
        
        function updateUI() {
            document.querySelectorAll('.hotel-card').forEach(card => {
                const cityId = parseInt(card.dataset.cityId);
                const hotelId = parseInt(card.dataset.hotelId);
                card.classList.toggle('is-selected', selectedHotels[cityId] === hotelId);
            });
            
            // Calculate total
            let total = 0;
            document.querySelectorAll('.hotel-card.is-selected').forEach(card => {
                const price = parseInt(card.dataset.price);
                const nights = parseInt(card.dataset.nights);
                total += price * nights;
            });
            
            document.getElementById('totalHotels').textContent = `$${total}`;
            document.getElementById('grandTotal').textContent = `$${total}`;
            
            // Enable continue if all cities have hotels
            const allCitiesHaveHotels = selectedCities.every(city => selectedHotels[city.id]);
            continueBtn.disabled = !allCitiesHaveHotels;
        }
        
        continueBtn.addEventListener('click', () => {
            const hotelData = Object.keys(selectedHotels).map(cityId => {
                const card = document.querySelector(`.hotel-card[data-city-id="${cityId}"][data-hotel-id="${selectedHotels[cityId]}"]`);
                const price = parseInt(card.dataset.price);
                const nights = parseInt(card.dataset.nights);
                return {
                    cityId: parseInt(cityId),
                    hotelId: selectedHotels[cityId],
                    hotelName: card.querySelector('.hotel-card__name').textContent,
                    pricePerNight: price,
                    nights: nights,
                    total: price * nights
                };
            });
            localStorage.setItem('tripHotels', JSON.stringify(hotelData));
            window.location.href = 'select-entertainment.html';
        });
        
        // Load saved hotels
        const savedHotels = localStorage.getItem('tripHotels');
        if (savedHotels) {
            const hotels = JSON.parse(savedHotels);
            hotels.forEach(h => { selectedHotels[h.cityId] = h.hotelId; });
        }
        
        async function loadHotels() {
            hotelsContainer.innerHTML = '<p style="color: var(--color-gray-500);">Loading hotels...</p>';

            try {
                const loaded = await Promise.all(selectedCities.map(async city => {
                    const hotels = await api.getHotelsByCity(city.id);
                    return [city.id, hotels];
                }));

                loaded.forEach(([cityId, hotels]) => {
                    if (hotels.length) {
                        hotelsByCityId[cityId] = hotels;
                    }
                });
            } catch (error) {
                console.warn('Using fallback hotels:', error);
            }

            renderHotels();
            updateUI();
        }

        loadHotels();
    </script>
</body>
</html>
