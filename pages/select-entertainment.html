<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Entertainment - TripPlanner</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    
    <style>
        .page { min-height: 100vh; display: flex; flex-direction: column; }
        .page__header { background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-600) 100%); padding: var(--space-8) 0; color: var(--color-white); }
        .page__title { font-family: var(--font-secondary); font-size: var(--text-3xl); font-weight: var(--font-bold); margin-bottom: var(--space-2); }
        .page__subtitle { opacity: 0.9; }
        .page__content { flex: 1; padding: var(--space-12) 0; background-color: var(--color-gray-50); }
        
        /* Stepper */
        .stepper { display: flex; justify-content: center; padding: var(--space-4) 0; margin-bottom: var(--space-8); flex-wrap: wrap; gap: var(--space-2); }
        .stepper__step { display: flex; flex-direction: column; align-items: center; min-width: 80px; }
        .stepper__step-icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background-color: var(--color-white); border: 2px solid var(--color-gray-300); border-radius: var(--radius-full); color: var(--color-gray-400); margin-bottom: var(--space-2); }
        .stepper__step-icon svg { width: 24px; height: 24px; }
        .stepper__step-label { font-size: var(--text-xs); font-weight: var(--font-medium); color: var(--color-gray-500); }
        .stepper__step.is-active .stepper__step-icon { background-color: var(--color-primary); border-color: var(--color-primary); color: var(--color-white); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2); }
        .stepper__step.is-active .stepper__step-label { color: var(--color-primary); font-weight: var(--font-semibold); }
        .stepper__step.is-completed .stepper__step-icon { background-color: var(--color-success); border-color: var(--color-success); color: var(--color-white); }
        
        /* City Section */
        .city-section { margin-bottom: var(--space-12); }
        .city-section__header { margin-bottom: var(--space-6); }
        .city-section__title { font-family: var(--font-secondary); font-size: var(--text-2xl); font-weight: var(--font-bold); color: var(--color-gray-800); }
        
        /* Entertainment Grid */
        .entertainment-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-6); }
        
        /* Entertainment Card */
        .entertainment-card { background-color: var(--color-white); border-radius: var(--radius-xl); overflow: hidden; box-shadow: var(--shadow-md); cursor: pointer; transition: all var(--transition-normal); }
        .entertainment-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-xl); }
        .entertainment-card.is-selected { box-shadow: 0 0 0 3px var(--color-primary), var(--shadow-xl); }
        .entertainment-card__image { width: 100%; height: 160px; object-fit: cover; }
        .entertainment-card__body { padding: var(--space-5); }
        .entertainment-card__type { display: inline-block; font-size: var(--text-xs); font-weight: var(--font-semibold); text-transform: uppercase; letter-spacing: 1px; color: var(--color-secondary); margin-bottom: var(--space-2); }
        .entertainment-card__name { font-family: var(--font-secondary); font-size: var(--text-lg); font-weight: var(--font-semibold); color: var(--color-gray-800); margin-bottom: var(--space-2); }
        .entertainment-card__meta { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-3); font-size: var(--text-sm); color: var(--color-gray-500); }
        .entertainment-card__meta svg { width: 16px; height: 16px; }
        .entertainment-card__description { font-size: var(--text-sm); color: var(--color-gray-600); margin-bottom: var(--space-4); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .entertainment-card__footer { display: flex; justify-content: space-between; align-items: center; }
        .entertainment-card__price { font-family: var(--font-secondary); font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-primary); }
        .entertainment-card__free { display: inline-block; padding: var(--space-1) var(--space-3); background-color: var(--color-success); color: var(--color-white); font-size: var(--text-sm); font-weight: var(--font-semibold); border-radius: var(--radius-full); }
        
        /* Checkbox */
        .entertainment-card__checkbox { position: absolute; top: var(--space-3); right: var(--space-3); width: 24px; height: 24px; border: 2px solid var(--color-white); border-radius: var(--radius-md); background-color: rgba(255, 255, 255, 0.3); display: flex; align-items: center; justify-content: center; opacity: 0; transition: all var(--transition-fast); }
        .entertainment-card { position: relative; }
        .entertainment-card:hover .entertainment-card__checkbox { opacity: 1; }
        .entertainment-card.is-selected .entertainment-card__checkbox { opacity: 1; background-color: var(--color-primary); border-color: var(--color-primary); }
        .entertainment-card__checkbox svg { width: 14px; height: 14px; color: var(--color-white); opacity: 0; }
        .entertainment-card.is-selected .entertainment-card__checkbox svg { opacity: 1; }
        
        /* Summary */
        .expense-summary { position: sticky; top: 100px; background-color: var(--color-white); border-radius: var(--radius-xl); padding: var(--space-6); box-shadow: var(--shadow-lg); }
        .expense-summary__title { font-family: var(--font-secondary); font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-gray-800); margin-bottom: var(--space-4); }
        .expense-summary__row { display: flex; justify-content: space-between; padding: var(--space-2) 0; }
        .expense-summary__label { color: var(--color-gray-600); }
        .expense-summary__value { font-weight: var(--font-semibold); color: var(--color-gray-800); }
        .expense-summary__divider { height: 1px; background-color: var(--color-gray-200); margin: var(--space-4) 0; }
        .expense-summary__total .expense-summary__label { font-weight: var(--font-semibold); font-size: var(--text-lg); color: var(--color-gray-800); }
        .expense-summary__total .expense-summary__value { font-family: var(--font-secondary); font-size: var(--text-2xl); font-weight: var(--font-bold); color: var(--color-primary); }
        
        .page__layout { display: grid; grid-template-columns: 1fr 320px; gap: var(--space-8); align-items: start; }
        @media (max-width: 1024px) { .page__layout { grid-template-columns: 1fr; } .expense-summary { position: static; } }
        
        .page__actions { display: flex; justify-content: space-between; gap: var(--space-4); padding: var(--space-6); background-color: var(--color-white); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); margin-top: var(--space-8); }
        .page__actions .btn { min-width: 150px; }
        
        .skip-note { text-align: center; padding: var(--space-4); background-color: var(--color-gray-100); border-radius: var(--radius-lg); margin-bottom: var(--space-8); color: var(--color-gray-600); }
    </style>
</head>
<body>
    <div class="page">
        <header class="header is-scrolled">
            <div class="container">
                <div class="header__inner">
                    <a href="../index.html" class="header__logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="32" height="32"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                        <span class="header__logo-text">TripPlanner</span>
                    </a>
                    <a href="../index.html" class="btn btn--outline">Back to Home</a>
                </div>
            </div>
        </header>

        <div class="page__header">
            <div class="container">
                <h1 class="page__title">Select Entertainment</h1>
                <p class="page__subtitle">Pre-book activities and attractions (optional)</p>
            </div>
        </div>

        <main class="page__content">
            <div class="container">
                <!-- Stepper -->
                <div class="stepper">
                    <div class="stepper__step is-completed"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span class="stepper__step-label">Dates</span></div>
                    <div class="stepper__step is-completed"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span class="stepper__step-label">Countries</span></div>
                    <div class="stepper__step is-completed"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span class="stepper__step-label">Cities</span></div>
                    <div class="stepper__step is-completed"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span class="stepper__step-label">Hotels</span></div>
                    <div class="stepper__step is-active"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></div><span class="stepper__step-label">Activities</span></div>
                    <div class="stepper__step"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg></div><span class="stepper__step-label">Checkout</span></div>
                </div>

                <div class="skip-note">
                    This step is optional. You can skip to checkout if you don't want to pre-book any activities.
                </div>

                <div class="page__layout">
                    <div>
                        <div id="entertainmentContainer"></div>
                        
                        <div class="page__actions">
                            <a href="select-hotels.html" class="btn btn--outline">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                                Back
                            </a>
                            <button type="button" class="btn btn--primary" id="continueBtn">
                                Continue to Summary
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="expense-summary">
                        <h3 class="expense-summary__title">Trip Summary</h3>
                        <div class="expense-summary__row">
                            <span class="expense-summary__label">Hotels</span>
                            <span class="expense-summary__value" id="totalHotels">$0</span>
                        </div>
                        <div class="expense-summary__row">
                            <span class="expense-summary__label">Activities</span>
                            <span class="expense-summary__value" id="totalActivities">$0</span>
                        </div>
                        <div class="expense-summary__divider"></div>
                        <div class="expense-summary__row expense-summary__total">
                            <span class="expense-summary__label">Total</span>
                            <span class="expense-summary__value" id="grandTotal">$0</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const entertainmentByCityId = {
            1: [ // Paris
                { id: 1, name: 'Eiffel Tower Tour', type: 'Landmark', duration: '2 hours', price: 35, description: 'Skip-the-line access to the iconic Paris landmark.', image: 'https://images.unsplash.com/photo-1511739001486-6bfe10ce65f4?w=400&h=200&fit=crop' },
                { id: 2, name: 'Louvre Museum', type: 'Museum', duration: '3 hours', price: 25, description: 'Explore world-famous art including the Mona Lisa.', image: 'https://images.unsplash.com/photo-1499426600726-ac2c83e6f560?w=400&h=200&fit=crop' },
                { id: 3, name: 'Seine River Cruise', type: 'Tour', duration: '1 hour', price: 20, description: 'Scenic boat tour along the Seine River.', image: 'https://images.unsplash.com/photo-1520939817895-060bdaf4fe1b?w=400&h=200&fit=crop' }
            ],
            3: [ // Tokyo
                { id: 4, name: 'Senso-ji Temple', type: 'Temple', duration: '2 hours', price: 0, description: 'Tokyo\'s oldest and most famous Buddhist temple.', image: 'https://images.unsplash.com/photo-1583169927774-5e421a9f3fc3?w=400&h=200&fit=crop' },
                { id: 5, name: 'Tokyo Skytree', type: 'Observation', duration: '2 hours', price: 30, description: '360-degree views of Tokyo from 450m high.', image: 'https://images.unsplash.com/photo-1536098561742-ca998e48cbcc?w=400&h=200&fit=crop' }
            ],
            5: [ // Rome
                { id: 6, name: 'Colosseum Tour', type: 'Historic', duration: '3 hours', price: 45, description: 'Guided tour of the ancient Roman amphitheater.', image: 'https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=400&h=200&fit=crop' },
                { id: 7, name: 'Vatican Museums', type: 'Museum', duration: '4 hours', price: 35, description: 'Sistine Chapel and world-class art collections.', image: 'https://images.unsplash.com/photo-1531572753322-ad063cecc140?w=400&h=200&fit=crop' }
            ],
            7: [ // New York
                { id: 8, name: 'Empire State Building', type: 'Observation', duration: '2 hours', price: 44, description: 'Iconic NYC views from the 86th floor.', image: 'https://images.unsplash.com/photo-1555109307-f7d9da25c244?w=400&h=200&fit=crop' },
                { id: 9, name: 'Statue of Liberty', type: 'Landmark', duration: '4 hours', price: 24, description: 'Ferry ride and tour of Lady Liberty.', image: 'https://images.unsplash.com/photo-1605130284535-11dd9eedc58a?w=400&h=200&fit=crop' }
            ]
        };
        
        const defaultEntertainment = [
            { id: 100, name: 'City Walking Tour', type: 'Tour', duration: '3 hours', price: 25, description: 'Guided tour of the city\'s main attractions.', image: 'https://images.unsplash.com/photo-1569154941061-e231b4725ef1?w=400&h=200&fit=crop' },
            { id: 101, name: 'Local Food Tour', type: 'Food', duration: '4 hours', price: 60, description: 'Sample local cuisine with a knowledgeable guide.', image: 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400&h=200&fit=crop' }
        ];
        
        let selectedEntertainment = []; // Array of entertainment IDs
        let selectedCities = [];
        let hotelTotal = 0;
        
        const savedCities = localStorage.getItem('tripCities');
        const savedHotels = localStorage.getItem('tripHotels');
        
        if (savedCities) {
            selectedCities = JSON.parse(savedCities);
        }
        if (savedHotels) {
            const hotels = JSON.parse(savedHotels);
            hotelTotal = hotels.reduce((sum, h) => sum + h.total, 0);
        }
        
        const entertainmentContainer = document.getElementById('entertainmentContainer');
        const continueBtn = document.getElementById('continueBtn');
        
        function renderEntertainment() {
            entertainmentContainer.innerHTML = selectedCities.map(city => {
                let entertainment = entertainmentByCityId[city.id] || defaultEntertainment.map((e, i) => ({ ...e, id: city.id * 1000 + i }));
                return `
                    <div class="city-section">
                        <div class="city-section__header">
                            <h2 class="city-section__title">${city.name}</h2>
                        </div>
                        <div class="entertainment-grid">
                            ${entertainment.map(item => `
                                <div class="entertainment-card ${selectedEntertainment.includes(item.id) ? 'is-selected' : ''}" 
                                     data-id="${item.id}" data-price="${item.price}" data-name="${item.name}">
                                    <img src="${item.image}" alt="${item.name}" class="entertainment-card__image">
                                    <div class="entertainment-card__body">
                                        <span class="entertainment-card__type">${item.type}</span>
                                        <h3 class="entertainment-card__name">${item.name}</h3>
                                        <div class="entertainment-card__meta">
                                            <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> ${item.duration}</span>
                                        </div>
                                        <p class="entertainment-card__description">${item.description}</p>
                                        <div class="entertainment-card__footer">
                                            ${item.price > 0 ? `<span class="entertainment-card__price">$${item.price}</span>` : '<span class="entertainment-card__free">Free</span>'}
                                            <button class="btn btn--primary btn--sm">${selectedEntertainment.includes(item.id) ? 'Remove' : 'Add'}</button>
                                        </div>
                                    </div>
                                    <div class="entertainment-card__checkbox">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
            
            document.querySelectorAll('.entertainment-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = parseInt(card.dataset.id);
                    toggleEntertainment(id);
                });
            });
        }
        
        function toggleEntertainment(id) {
            const index = selectedEntertainment.indexOf(id);
            if (index > -1) {
                selectedEntertainment.splice(index, 1);
            } else {
                selectedEntertainment.push(id);
            }
            updateUI();
        }
        
        function updateUI() {
            document.querySelectorAll('.entertainment-card').forEach(card => {
                const id = parseInt(card.dataset.id);
                const isSelected = selectedEntertainment.includes(id);
                card.classList.toggle('is-selected', isSelected);
                card.querySelector('.btn').textContent = isSelected ? 'Remove' : 'Add';
            });
            
            let activityTotal = 0;
            selectedEntertainment.forEach(id => {
                const card = document.querySelector(`.entertainment-card[data-id="${id}"]`);
                if (card) {
                    activityTotal += parseInt(card.dataset.price) || 0;
                }
            });
            
            document.getElementById('totalHotels').textContent = `$${hotelTotal}`;
            document.getElementById('totalActivities').textContent = `$${activityTotal}`;
            document.getElementById('grandTotal').textContent = `$${hotelTotal + activityTotal}`;
        }
        
        continueBtn.addEventListener('click', () => {
            const entertainmentData = selectedEntertainment.map(id => {
                const card = document.querySelector(`.entertainment-card[data-id="${id}"]`);
                return {
                    id: id,
                    name: card.dataset.name,
                    price: parseInt(card.dataset.price) || 0
                };
            });
            localStorage.setItem('tripEntertainment', JSON.stringify(entertainmentData));
            window.location.href = 'trip-summary.html';
        });
        
        // Load saved entertainment
        const savedEntertainment = localStorage.getItem('tripEntertainment');
        if (savedEntertainment) {
            const entertainment = JSON.parse(savedEntertainment);
            selectedEntertainment = entertainment.map(e => e.id);
        }
        
        renderEntertainment();
        updateUI();
    </script>
</body>
</html>
