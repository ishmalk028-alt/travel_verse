<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Activities — TripPlanner</title>
  <meta name="description" content="Step 5: Browse and pre-book tours, experiences, and activities." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body class="planner-page">

<header class="site-header">
  <div class="container">
    <div class="site-header__inner">
      <a href="../index.html" class="site-logo">
        <div class="site-logo__icon">✈️</div>
        <span class="site-logo__text">TripPlanner</span>
      </a>
      <div class="trip-progress">
        <span class="text-sm text-secondary">Step 5 of 7</span>
        <div class="trip-progress__bar">
          <div class="trip-progress__fill" style="width:71%"></div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="planner-stepper-bar">
  <div class="container"><div id="stepper"></div></div>
</div>

<main>
  <div class="container">
    <div class="planner-layout">
      <div class="planner-main">
        <div class="page-header">
          <button class="page-header__back" onclick="history.back()">← Back</button>
          <div class="section-tag"><span>🎭</span> Step 5 (Optional)</div>
          <h1 class="page-header__title">Add Activities<br><span class="gradient-text">&amp; Experiences</span></h1>
          <p class="page-header__subtitle">Pre-book tours and activities. You can skip this step.</p>
        </div>

        <!-- Category filter -->
        <div class="filter-bar mb-6">
          <button class="filter-chip filter-chip--active" data-cat="all">All</button>
          <button class="filter-chip" data-cat="Sightseeing">🏛️ Sightseeing</button>
          <button class="filter-chip" data-cat="Food & Drink">🍜 Food</button>
          <button class="filter-chip" data-cat="Adventure">🏄 Adventure</button>
          <button class="filter-chip" data-cat="Art & Culture">🎨 Culture</button>
          <button class="filter-chip" data-cat="Nature">🌿 Nature</button>
        </div>

        <div id="entertainment-container">
          <!-- City groups injected by JS -->
        </div>
      </div>

      <aside class="planner-sidebar">
        <div id="expense-sidebar"></div>
        <div class="card mt-4">
          <div class="card__body">
            <h3 class="text-sm font-bold mb-3">🎭 Selected Activities</h3>
            <div id="activities-summary">
              <p class="text-sm text-muted">No activities selected.</p>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <div class="step-nav">
      <button class="btn btn--ghost" onclick="history.back()">← Back</button>
      <div class="flex gap-3">
        <button class="btn btn--secondary btn--lg" id="skip-btn">Skip This Step</button>
        <button class="btn btn--primary btn--lg" id="next-btn">
          View Trip Summary →
        </button>
      </div>
    </div>
  </div>
</main>

<div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

<script type="module">
  import { tripPlannerVM } from '../js/viewmodels/TripPlannerVM.js';
  import { ExpenseCalculatorVM } from '../js/viewmodels/ExpenseCalculatorVM.js';
  import { renderStepper } from '../js/app.js';
  import { showToast } from '../js/utils/helpers.js';
  import { formatCurrency, truncate } from '../js/utils/formatters.js';

  const expenseVM = new ExpenseCalculatorVM();
  expenseVM.renderSidebar(document.getElementById('expense-sidebar'));
  renderStepper(5, document.getElementById('stepper'));

  const cities    = tripPlannerVM.trip.cities;
  const container = document.getElementById('entertainment-container');
  let activeCategory = 'all';
  let cityActivitiesMap = {}; // cityId -> activities[]

  if (!cities.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state__icon">🏙️</div>
        <div class="empty-state__title">No cities selected</div>
        <a href="select-cities.html" class="btn btn--primary mt-4">← Select Cities</a>
      </div>`;
  } else {
    loadAllActivities();
  }

  async function loadAllActivities() {
    for (const city of cities) {
      const country = tripPlannerVM.trip.countries.find(c => c.id === city.countryId);
      const section = document.createElement('div');
      section.className = 'mb-10';
      section.id = `ent-section-${city.id}`;
      section.innerHTML = `
        <div class="flex items-center gap-3 mb-5">
          <span class="text-2xl">${country?.flag || '🏙️'}</span>
          <h2 class="text-xl font-bold">${city.name}</h2>
          <span class="badge badge--primary">${city.nights} nights</span>
        </div>
        <div class="card-grid" id="ent-grid-${city.id}">
          <div class="skeleton" style="height:260px;border-radius:var(--radius-xl)"></div>
          <div class="skeleton" style="height:260px;border-radius:var(--radius-xl)"></div>
          <div class="skeleton" style="height:260px;border-radius:var(--radius-xl)"></div>
        </div>`;
      container.appendChild(section);

      try {
        const activities = await tripPlannerVM.loadEntertainment(city.id);
        cityActivitiesMap[city.id] = activities;
        renderGrid(activities, city, `ent-grid-${city.id}`);
      } catch {
        document.getElementById(`ent-grid-${city.id}`).innerHTML =
          '<p class="text-secondary">No activities available for this city.</p>';
      }
    }
  }

  function renderGrid(activities, city, gridId) {
    const grid = document.getElementById(gridId);
    const filtered = activeCategory === 'all'
      ? activities
      : activities.filter(a => a.category === activeCategory);

    if (!filtered.length) {
      grid.innerHTML = '<p class="text-secondary p-4">No activities in this category.</p>';
      return;
    }

    grid.innerHTML = filtered.map(act => {
      const selected = tripPlannerVM.isEntertainmentSelected(act.id);
      return `
        <div class="card card--selectable ${selected ? 'card--selected' : ''}"
             id="act-card-${act.id}" data-act-id="${act.id}" data-city-id="${city.id}"
             role="button" tabindex="0" aria-pressed="${selected}">
          <div class="card__image-wrapper">
            <img src="${act.imageUrl}" alt="${act.name}" class="card__image" loading="lazy"
                 onerror="this.src='https://images.unsplash.com/photo-1501901609772-df0848060b33?w=400&q=60'" />
            <div class="card__badge">${act.emoji} ${act.type}</div>
            ${selected ? `<div style="position:absolute;top:var(--space-3);left:var(--space-3);width:28px;height:28px;background:var(--gradient-primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2;">✓</div>` : ''}
          </div>
          <div class="card__body">
            <div class="card__tag">${act.category}</div>
            <h3 class="card__title">${act.name}</h3>
            <p class="card__text">${truncate(act.description, 80)}</p>
            <div class="flex gap-4 mt-3">
              <span class="text-xs text-secondary">⏱️ ${act.duration}</span>
              <span class="text-xs text-accent font-semibold">⭐ ${act.rating}</span>
            </div>
          </div>
          <div class="card__footer">
            <div class="card__price">
              <span class="card__price-label">Per person</span>
              <span class="card__price-value">${formatCurrency(act.price)}</span>
            </div>
            <button class="btn btn--sm ${selected ? 'btn--danger' : 'btn--primary'}" data-toggle-act="${act.id}">
              ${selected ? '✓ Added' : '+ Add'}
            </button>
          </div>
        </div>`;
    }).join('');

    grid.querySelectorAll('[data-toggle-act]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const actId = parseInt(btn.dataset.toggleAct);
        const act   = cityActivitiesMap[city.id]?.find(a => a.id === actId);
        if (!act) return;
        tripPlannerVM.toggleEntertainment(act);
        const isNow = tripPlannerVM.isEntertainmentSelected(actId);
        showToast(
          isNow ? `${act.name} added!` : `${act.name} removed.`,
          isNow ? 'success' : 'warning'
        );
        renderGrid(cityActivitiesMap[city.id], city, gridId);
        updateActivitiesSummary();
        expenseVM.recalculate();
        expenseVM.renderSidebar(document.getElementById('expense-sidebar'));
      });
    });
  }

  function updateActivitiesSummary() {
    const acts  = tripPlannerVM.trip.entertainment;
    const sumEl = document.getElementById('activities-summary');
    if (!acts.length) {
      sumEl.innerHTML = '<p class="text-sm text-muted">No activities selected.</p>';
      return;
    }
    const total = acts.reduce((s, a) => s + a.price, 0);
    sumEl.innerHTML = acts.map(a => `
      <div class="flex justify-between items-center py-2 border-b" style="border-color:var(--border-color)">
        <span class="text-sm">${a.emoji} ${a.name.length > 20 ? a.name.slice(0,20) + '…' : a.name}</span>
        <span class="text-sm font-semibold">${formatCurrency(a.price)}</span>
      </div>`).join('') +
      `<div class="flex justify-between py-2 font-bold text-sm">
        <span>Total</span><span class="gradient-text">${formatCurrency(total)}</span>
      </div>`;
  }

  // Category filter
  document.querySelectorAll('[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('filter-chip--active'));
      btn.classList.add('filter-chip--active');
      activeCategory = btn.dataset.cat;
      // Re-render all grids
      cities.forEach(city => {
        if (cityActivitiesMap[city.id]) {
          renderGrid(cityActivitiesMap[city.id], city, `ent-grid-${city.id}`);
        }
      });
    });
  });

  document.getElementById('skip-btn').addEventListener('click', () => { window.location.href = 'trip-summary.html'; });
  document.getElementById('next-btn').addEventListener('click', () => { window.location.href = 'trip-summary.html'; });
</script>
</body>
</html>
