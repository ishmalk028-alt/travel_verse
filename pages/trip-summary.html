<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Summary - TripPlanner</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    
    <style>
        .page { min-height: 100vh; display: flex; flex-direction: column; }
        .page__header { background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-600) 100%); padding: var(--space-8) 0; color: var(--color-white); }
        .page__title { font-family: var(--font-secondary); font-size: var(--text-3xl); font-weight: var(--font-bold); margin-bottom: var(--space-2); }
        .page__subtitle { opacity: 0.9; }
        .page__content { flex: 1; padding: var(--space-12) 0; background-color: var(--color-gray-50); }
        
        /* Stepper */
        .stepper { display: flex; justify-content: center; padding: var(--space-4) 0; margin-bottom: var(--space-8); flex-wrap: wrap; gap: var(--space-2); }
        .stepper__step { display: flex; flex-direction: column; align-items: center; min-width: 80px; }
        .stepper__step-icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background-color: var(--color-white); border: 2px solid var(--color-gray-300); border-radius: var(--radius-full); color: var(--color-gray-400); margin-bottom: var(--space-2); }
        .stepper__step-icon svg { width: 24px; height: 24px; }
        .stepper__step-label { font-size: var(--text-xs); font-weight: var(--font-medium); color: var(--color-gray-500); }
        .stepper__step.is-completed .stepper__step-icon { background-color: var(--color-success); border-color: var(--color-success); color: var(--color-white); }
        
        /* Summary Card */
        .summary-card { background-color: var(--color-white); border-radius: var(--radius-xl); padding: var(--space-8); box-shadow: var(--shadow-lg); margin-bottom: var(--space-8); }
        .summary-card__header { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-6); padding-bottom: var(--space-6); border-bottom: 1px solid var(--color-gray-200); }
        .summary-card__icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; background-color: var(--color-primary-100); border-radius: var(--radius-lg); color: var(--color-primary); }
        .summary-card__icon svg { width: 24px; height: 24px; }
        .summary-card__title { font-family: var(--font-secondary); font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-gray-800); }
        .summary-card__subtitle { font-size: var(--text-sm); color: var(--color-gray-500); }
        
        /* Summary Items */
        .summary-item { display: flex; justify-content: space-between; align-items: flex-start; padding: var(--space-4) 0; border-bottom: 1px solid var(--color-gray-100); }
        .summary-item:last-child { border-bottom: none; }
        .summary-item__info { flex: 1; }
        .summary-item__name { font-weight: var(--font-semibold); color: var(--color-gray-800); margin-bottom: var(--space-1); }
        .summary-item__details { font-size: var(--text-sm); color: var(--color-gray-500); }
        .summary-item__price { font-family: var(--font-secondary); font-weight: var(--font-bold); color: var(--color-gray-800); }
        
        /* Price Summary */
        .price-summary { background-color: var(--color-white); border-radius: var(--radius-xl); padding: var(--space-8); box-shadow: var(--shadow-lg); position: sticky; top: 100px; }
        .price-summary__title { font-family: var(--font-secondary); font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-gray-800); margin-bottom: var(--space-6); }
        .price-summary__row { display: flex; justify-content: space-between; padding: var(--space-3) 0; }
        .price-summary__label { color: var(--color-gray-600); }
        .price-summary__value { font-weight: var(--font-semibold); color: var(--color-gray-800); }
        .price-summary__divider { height: 1px; background-color: var(--color-gray-200); margin: var(--space-4) 0; }
        .price-summary__total { display: flex; justify-content: space-between; padding: var(--space-4) 0; }
        .price-summary__total .price-summary__label { font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-gray-800); }
        .price-summary__total .price-summary__value { font-family: var(--font-secondary); font-size: var(--text-3xl); font-weight: var(--font-bold); color: var(--color-primary); }
        .price-summary__btn { margin-top: var(--space-6); }
        
        /* Layout */
        .page__layout { display: grid; grid-template-columns: 1fr 380px; gap: var(--space-8); align-items: start; }
        @media (max-width: 1024px) { .page__layout { grid-template-columns: 1fr; } .price-summary { position: static; } }
        
        /* Actions */
        .page__actions { display: flex; justify-content: space-between; gap: var(--space-4); padding: var(--space-6); background-color: var(--color-white); border-radius: var(--radius-xl); box-shadow: var(--shadow-sm); }
        .page__actions .btn { min-width: 150px; }
        
        /* Dates Display */
        .dates-display { display: flex; align-items: center; gap: var(--space-6); padding: var(--space-4); background-color: var(--color-gray-50); border-radius: var(--radius-lg); margin-bottom: var(--space-6); }
        .dates-display__item { display: flex; flex-direction: column; }
        .dates-display__label { font-size: var(--text-xs); color: var(--color-gray-500); text-transform: uppercase; letter-spacing: 1px; }
        .dates-display__value { font-weight: var(--font-semibold); color: var(--color-gray-800); }
        .dates-display__arrow { color: var(--color-gray-400); }
    </style>
</head>
<body>
    <div class="page">
        <header class="header is-scrolled">
            <div class="container">
                <div class="header__inner">
                    <a href="../index.html" class="header__logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="32" height="32"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                        <span class="header__logo-text">TripPlanner</span>
                    </a>
                    <a href="../index.html" class="btn btn--outline">Back to Home</a>
                </div>
            </div>
        </header>

        <div class="page__header">
            <div class="container">
                <h1 class="page__title">Trip Summary</h1>
                <p class="page__subtitle">Review your complete trip itinerary</p>
            </div>
        </div>

        <main class="page__content">
            <div class="container">
                <!-- Stepper -->
                <div class="stepper">
                    <div class="stepper__step is-completed"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span class="stepper__step-label">Dates</span></div>
                    <div class="stepper__step is-completed"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span class="stepper__step-label">Countries</span></div>
                    <div class="stepper__step is-completed"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span class="stepper__step-label">Cities</span></div>
                    <div class="stepper__step is-completed"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span class="stepper__step-label">Hotels</span></div>
                    <div class="stepper__step is-completed"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span class="stepper__step-label">Activities</span></div>
                    <div class="stepper__step is-completed"><div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></div><span class="stepper__step-label">Summary</span></div>
                </div>

                <div class="page__layout">
                    <div>
                        <!-- Dates -->
                        <div class="dates-display" id="datesDisplay"></div>
                        
                        <!-- Hotels -->
                        <div class="summary-card">
                            <div class="summary-card__header">
                                <div class="summary-card__icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                                </div>
                                <div>
                                    <h3 class="summary-card__title">Accommodations</h3>
                                    <p class="summary-card__subtitle">Your booked hotels</p>
                                </div>
                            </div>
                            <div id="hotelslist"></div>
                        </div>
                        
                        <!-- Entertainment -->
                        <div class="summary-card" id="entertainmentCard">
                            <div class="summary-card__header">
                                <div class="summary-card__icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                                </div>
                                <div>
                                    <h3 class="summary-card__title">Activities</h3>
                                    <p class="summary-card__subtitle">Pre-booked entertainment</p>
                                </div>
                            </div>
                            <div id="entertainmentList"></div>
                        </div>
                        
                        <div class="page__actions">
                            <a href="select-entertainment.html" class="btn btn--outline">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                                Back
                            </a>
                            <button type="button" class="btn btn--primary" id="continueBtn">
                                Proceed to Checkout
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="price-summary">
                        <h3 class="price-summary__title">Price Breakdown</h3>
                        <div class="price-summary__row">
                            <span class="price-summary__label">Hotels</span>
                            <span class="price-summary__value" id="totalHotels">$0</span>
                        </div>
                        <div class="price-summary__row">
                            <span class="price-summary__label">Activities</span>
                            <span class="price-summary__value" id="totalActivities">$0</span>
                        </div>
                        <div class="price-summary__row" style="color: var(--color-gray-400); font-size: 14px;">
                            <span class="price-summary__label">Service Fee</span>
                            <span class="price-summary__value" id="serviceFee">$0</span>
                        </div>
                        <div class="price-summary__divider"></div>
                        <div class="price-summary__total">
                            <span class="price-summary__label">Total</span>
                            <span class="price-summary__value" id="grandTotal">$0</span>
                        </div>
                        <button class="btn btn--primary btn--block price-summary__btn" id="checkoutBtn">
                            Proceed to Checkout
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Load all data
        const dates = JSON.parse(localStorage.getItem('tripDates') || '{}');
        const hotels = JSON.parse(localStorage.getItem('tripHotels') || '[]');
        const entertainment = JSON.parse(localStorage.getItem('tripEntertainment') || '[]');
        
        // Format date
        function formatDate(dateStr) {
            if (!dateStr) return 'Not set';
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        }
        
        // Render dates
        document.getElementById('datesDisplay').innerHTML = `
            <div class="dates-display__item">
                <span class="dates-display__label">Departure</span>
                <span class="dates-display__value">${formatDate(dates.startDate)}</span>
            </div>
            <span class="dates-display__arrow">→</span>
            <div class="dates-display__item">
                <span class="dates-display__label">Return</span>
                <span class="dates-display__value">${formatDate(dates.endDate)}</span>
            </div>
        `;
        
        // Render hotels
        let hotelTotal = 0;
        document.getElementById('hotelslist').innerHTML = hotels.map(hotel => {
            hotelTotal += hotel.total;
            return `
                <div class="summary-item">
                    <div class="summary-item__info">
                        <div class="summary-item__name">${hotel.hotelName}</div>
                        <div class="summary-item__details">${hotel.nights} nights × $${hotel.pricePerNight}/night</div>
                    </div>
                    <div class="summary-item__price">$${hotel.total}</div>
                </div>
            `;
        }).join('') || '<p style="color: var(--color-gray-500);">No hotels selected</p>';
        
        // Render entertainment
        let activityTotal = 0;
        const entertainmentCard = document.getElementById('entertainmentCard');
        if (entertainment.length > 0) {
            document.getElementById('entertainmentList').innerHTML = entertainment.map(item => {
                activityTotal += item.price;
                return `
                    <div class="summary-item">
                        <div class="summary-item__info">
                            <div class="summary-item__name">${item.name}</div>
                        </div>
                        <div class="summary-item__price">${item.price > 0 ? '$' + item.price : 'Free'}</div>
                    </div>
                `;
            }).join('');
        } else {
            entertainmentCard.style.display = 'none';
        }
        
        // Calculate totals
        const serviceFee = Math.round((hotelTotal + activityTotal) * 0.05);
        const grandTotal = hotelTotal + activityTotal + serviceFee;
        
        document.getElementById('totalHotels').textContent = `$${hotelTotal}`;
        document.getElementById('totalActivities').textContent = `$${activityTotal}`;
        document.getElementById('serviceFee').textContent = `$${serviceFee}`;
        document.getElementById('grandTotal').textContent = `$${grandTotal}`;
        
        // Save total
        localStorage.setItem('tripTotal', JSON.stringify({
            hotels: hotelTotal,
            activities: activityTotal,
            serviceFee: serviceFee,
            total: grandTotal
        }));
        
        // Checkout buttons
        document.getElementById('continueBtn').addEventListener('click', () => {
            window.location.href = 'checkout.html';
        });
        
        document.getElementById('checkoutBtn').addEventListener('click', () => {
            window.location.href = 'checkout.html';
        });
    </script>
</body>
</html>
