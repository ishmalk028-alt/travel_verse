<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - TripPlanner</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    
    <style>
        .page { min-height: 100vh; display: flex; flex-direction: column; }
        .page__header { background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-600) 100%); padding: var(--space-8) 0; color: var(--color-white); }
        .page__title { font-family: var(--font-secondary); font-size: var(--text-3xl); font-weight: var(--font-bold); margin-bottom: var(--space-2); }
        .page__subtitle { opacity: 0.9; }
        .page__content { flex: 1; padding: var(--space-12) 0; background-color: var(--color-gray-50); }
        
        /* Layout */
        .page__layout { display: grid; grid-template-columns: 1fr 400px; gap: var(--space-8); align-items: start; }
        @media (max-width: 1024px) { .page__layout { grid-template-columns: 1fr; } }
        
        /* Form Card */
        .form-card { background-color: var(--color-white); border-radius: var(--radius-xl); padding: var(--space-8); box-shadow: var(--shadow-lg); margin-bottom: var(--space-8); }
        .form-card__header { margin-bottom: var(--space-6); padding-bottom: var(--space-6); border-bottom: 1px solid var(--color-gray-200); }
        .form-card__title { font-family: var(--font-secondary); font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-gray-800); }
        
        /* Form Grid */
        .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--space-4); }
        .form-grid--full { grid-template-columns: 1fr; }
        @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
        
        /* Form Group */
        .form-group { margin-bottom: var(--space-4); }
        .form-label { display: block; font-weight: var(--font-medium); color: var(--color-gray-700); margin-bottom: var(--space-2); }
        .form-input { width: 100%; padding: var(--space-3) var(--space-4); border: 2px solid var(--color-gray-200); border-radius: var(--radius-lg); font-size: var(--text-base); transition: all var(--transition-fast); }
        .form-input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        /* Order Summary */
        .order-summary { background-color: var(--color-white); border-radius: var(--radius-xl); padding: var(--space-8); box-shadow: var(--shadow-lg); position: sticky; top: 100px; }
        .order-summary__title { font-family: var(--font-secondary); font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-gray-800); margin-bottom: var(--space-6); }
        .order-summary__items { margin-bottom: var(--space-6); }
        .order-summary__item { display: flex; justify-content: space-between; padding: var(--space-2) 0; font-size: var(--text-sm); }
        .order-summary__item-name { color: var(--color-gray-600); }
        .order-summary__item-price { font-weight: var(--font-semibold); color: var(--color-gray-800); }
        .order-summary__divider { height: 1px; background-color: var(--color-gray-200); margin: var(--space-4) 0; }
        .order-summary__total { display: flex; justify-content: space-between; padding: var(--space-4) 0; }
        .order-summary__total-label { font-size: var(--text-lg); font-weight: var(--font-bold); color: var(--color-gray-800); }
        .order-summary__total-price { font-family: var(--font-secondary); font-size: var(--text-2xl); font-weight: var(--font-bold); color: var(--color-primary); }
        
        /* Payment Methods */
        .payment-methods { display: flex; flex-direction: column; gap: var(--space-3); margin-bottom: var(--space-6); }
        .payment-method { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4); border: 2px solid var(--color-gray-200); border-radius: var(--radius-lg); cursor: pointer; transition: all var(--transition-fast); }
        .payment-method:hover { border-color: var(--color-primary-300); }
        .payment-method.is-selected { border-color: var(--color-primary); background-color: var(--color-primary-50); }
        .payment-method__radio { width: 20px; height: 20px; border: 2px solid var(--color-gray-300); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .payment-method.is-selected .payment-method__radio { border-color: var(--color-primary); }
        .payment-method.is-selected .payment-method__radio::after { content: ''; width: 10px; height: 10px; background-color: var(--color-primary); border-radius: 50%; }
        .payment-method__icon { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background-color: var(--color-gray-100); border-radius: var(--radius-md); }
        .payment-method__icon svg { width: 24px; height: 24px; color: var(--color-gray-600); }
        .payment-method__name { font-weight: var(--font-medium); color: var(--color-gray-800); }
        
        /* Card Form */
        .card-form { display: none; }
        .card-form.is-visible { display: block; }
        
        /* Success Modal */
        .success-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .success-modal.is-visible { display: flex; }
        .success-modal__content { background-color: var(--color-white); border-radius: var(--radius-2xl); padding: var(--space-12); text-align: center; max-width: 480px; margin: var(--space-4); }
        .success-modal__icon { width: 80px; height: 80px; background-color: var(--color-success); color: var(--color-white); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-6); }
        .success-modal__icon svg { width: 40px; height: 40px; }
        .success-modal__title { font-family: var(--font-secondary); font-size: var(--text-2xl); font-weight: var(--font-bold); color: var(--color-gray-800); margin-bottom: var(--space-4); }
        .success-modal__text { color: var(--color-gray-600); margin-bottom: var(--space-8); }
        .success-modal__booking { background-color: var(--color-gray-100); padding: var(--space-4); border-radius: var(--radius-lg); margin-bottom: var(--space-6); }
        .success-modal__booking-label { font-size: var(--text-sm); color: var(--color-gray-500); }
        .success-modal__booking-id { font-family: var(--font-secondary); font-size: var(--text-xl); font-weight: var(--font-bold); color: var(--color-primary); }
    </style>
</head>
<body>
    <div class="page">
        <header class="header is-scrolled">
            <div class="container">
                <div class="header__inner">
                    <a href="../index.html" class="header__logo">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="32" height="32"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                        <span class="header__logo-text">TripPlanner</span>
                    </a>
                    <a href="../index.html" class="btn btn--outline">Back to Home</a>
                </div>
            </div>
        </header>

        <div class="page__header">
            <div class="container">
                <h1 class="page__title">Checkout</h1>
                <p class="page__subtitle">Complete your booking</p>
            </div>
        </div>

        <main class="page__content">
            <div class="container">
                <div class="page__layout">
                    <div>
                        <!-- Contact Information -->
                        <div class="form-card">
                            <div class="form-card__header">
                                <h2 class="form-card__title">Contact Information</h2>
                            </div>
                            <form id="checkoutForm">
                                <div class="form-grid">
                                    <div class="form-group">
                                        <label class="form-label" for="firstName">First Name</label>
                                        <input type="text" id="firstName" class="form-input" required>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="lastName">Last Name</label>
                                        <input type="text" id="lastName" class="form-input" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="email">Email Address</label>
                                    <input type="email" id="email" class="form-input" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="phone">Phone Number</label>
                                    <input type="tel" id="phone" class="form-input" required>
                                </div>
                            </form>
                        </div>
                        
                        <!-- Payment Method -->
                        <div class="form-card">
                            <div class="form-card__header">
                                <h2 class="form-card__title">Payment Method</h2>
                            </div>
                            
                            <div class="payment-methods">
                                <div class="payment-method is-selected" data-method="card">
                                    <div class="payment-method__radio"></div>
                                    <div class="payment-method__icon">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
                                    </div>
                                    <span class="payment-method__name">Credit / Debit Card</span>
                                </div>
                                <div class="payment-method" data-method="paypal">
                                    <div class="payment-method__radio"></div>
                                    <div class="payment-method__icon">
                                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.144 19.532l1.049-5.751c.11-.606.691-1.002 1.304-1.002h2.384c2.678 0 4.838-1.3 5.559-3.89.29-1.04.325-1.974.12-2.8-.17-.69-.508-1.284-1.007-1.779l-.013-.012C15.607 3.3 14.27 2.75 12.3 2.75H5.854c-.66 0-1.226.48-1.33 1.125L3.013 14.3c-.067.412.25.785.673.785h2.812z"/></svg>
                                    </div>
                                    <span class="payment-method__name">PayPal</span>
                                </div>
                            </div>
                            
                            <div class="card-form is-visible" id="cardForm">
                                <div class="form-group">
                                    <label class="form-label" for="cardNumber">Card Number</label>
                                    <input type="text" id="cardNumber" class="form-input" placeholder="1234 5678 9012 3456" maxlength="19">
                                </div>
                                <div class="form-grid">
                                    <div class="form-group">
                                        <label class="form-label" for="expiry">Expiry Date</label>
                                        <input type="text" id="expiry" class="form-input" placeholder="MM/YY" maxlength="5">
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" for="cvv">CVV</label>
                                        <input type="text" id="cvv" class="form-input" placeholder="123" maxlength="4">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="cardName">Name on Card</label>
                                    <input type="text" id="cardName" class="form-input" placeholder="John Doe">
                                </div>
                            </div>
                        </div>
                        
                        <div class="page__actions">
                            <a href="trip-summary.html" class="btn btn--outline">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                                Back
                            </a>
                            <button type="button" class="btn btn--primary" id="placeOrderBtn">
                                Complete Booking
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Order Summary -->
                    <div class="order-summary">
                        <h3 class="order-summary__title">Order Summary</h3>
                        <div class="order-summary__items" id="orderItems"></div>
                        <div class="order-summary__divider"></div>
                        <div class="order-summary__total">
                            <span class="order-summary__total-label">Total</span>
                            <span class="order-summary__total-price" id="orderTotal">$0</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Success Modal -->
    <div class="success-modal" id="successModal">
        <div class="success-modal__content">
            <div class="success-modal__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <h2 class="success-modal__title">Booking Confirmed!</h2>
            <p class="success-modal__text">Your trip has been booked successfully. We've sent a confirmation email to your inbox.</p>
            <div class="success-modal__booking">
                <div class="success-modal__booking-label">Booking ID</div>
                <div class="success-modal__booking-id" id="bookingId">TP-000000</div>
            </div>
            <a href="../index.html" class="btn btn--primary btn--block">Back to Home</a>
        </div>
    </div>

    <script>
        // Load totals
        const totals = JSON.parse(localStorage.getItem('tripTotal') || '{}');
        const hotels = JSON.parse(localStorage.getItem('tripHotels') || '[]');
        const entertainment = JSON.parse(localStorage.getItem('tripEntertainment') || '[]');
        
        // Render order items
        let orderItemsHtml = '';
        
        hotels.forEach(hotel => {
            orderItemsHtml += `
                <div class="order-summary__item">
                    <span class="order-summary__item-name">${hotel.hotelName} (${hotel.nights} nights)</span>
                    <span class="order-summary__item-price">$${hotel.total}</span>
                </div>
            `;
        });
        
        entertainment.forEach(item => {
            orderItemsHtml += `
                <div class="order-summary__item">
                    <span class="order-summary__item-name">${item.name}</span>
                    <span class="order-summary__item-price">${item.price > 0 ? '$' + item.price : 'Free'}</span>
                </div>
            `;
        });
        
        orderItemsHtml += `
            <div class="order-summary__item" style="color: var(--color-gray-400);">
                <span class="order-summary__item-name">Service Fee</span>
                <span class="order-summary__item-price">$${totals.serviceFee || 0}</span>
            </div>
        `;
        
        document.getElementById('orderItems').innerHTML = orderItemsHtml;
        document.getElementById('orderTotal').textContent = `$${totals.total || 0}`;
        
        // Payment method selection
        document.querySelectorAll('.payment-method').forEach(method => {
            method.addEventListener('click', () => {
                document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('is-selected'));
                method.classList.add('is-selected');
                
                const cardForm = document.getElementById('cardForm');
                if (method.dataset.method === 'card') {
                    cardForm.classList.add('is-visible');
                } else {
                    cardForm.classList.remove('is-visible');
                }
            });
        });
        
        // Card number formatting
        document.getElementById('cardNumber').addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            value = value.replace(/(\d{4})(?=\d)/g, '$1 ');
            e.target.value = value;
        });
        
        // Expiry formatting
        document.getElementById('expiry').addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) {
                value = value.substring(0, 2) + '/' + value.substring(2);
            }
            e.target.value = value;
        });
        
        // Place order
        document.getElementById('placeOrderBtn').addEventListener('click', () => {
            const form = document.getElementById('checkoutForm');
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const email = document.getElementById('email').value;
            
            if (!firstName || !lastName || !email) {
                alert('Please fill in all contact information fields.');
                return;
            }
            
            // Generate booking ID
            const bookingId = 'TP-' + Date.now().toString().slice(-6);
            document.getElementById('bookingId').textContent = bookingId;
            
            // Show success modal
            document.getElementById('successModal').classList.add('is-visible');
            
            // Clear trip data
            localStorage.removeItem('tripDates');
            localStorage.removeItem('tripCountries');
            localStorage.removeItem('tripCities');
            localStorage.removeItem('tripHotels');
            localStorage.removeItem('tripEntertainment');
            localStorage.removeItem('tripTotal');
        });
    </script>
</body>
</html>
