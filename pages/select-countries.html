<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Countries — TripPlanner</title>
  <meta name="description" content="Step 2: Choose the countries you want to visit on your trip." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body class="planner-page">

<header class="site-header">
  <div class="container">
    <div class="site-header__inner">
      <a href="../index.html" class="site-logo">
        <div class="site-logo__icon">✈️</div>
        <span class="site-logo__text">TripPlanner</span>
      </a>
      <div class="trip-progress">
        <span class="text-sm text-secondary">Step 2 of 7</span>
        <div class="trip-progress__bar">
          <div class="trip-progress__fill" style="width:28%"></div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="planner-stepper-bar">
  <div class="container"><div id="stepper"></div></div>
</div>

<main>
  <div class="container">
    <div class="planner-layout">
      <div class="planner-main">
        <div class="page-header">
          <button class="page-header__back" onclick="history.back()">← Back</button>
          <div class="section-tag"><span>🌍</span> Step 2</div>
          <h1 class="page-header__title">Which Countries<br><span class="gradient-text">Will You Visit?</span></h1>
          <p class="page-header__subtitle">Select one or more countries. You can pick cities in the next step.</p>
        </div>

        <!-- Filter bar -->
        <div class="filter-bar">
          <input type="text" id="country-search" class="form-input" placeholder="🔍 Search countries..." style="flex:1; min-width:160px" aria-label="Search countries" />
          <button class="filter-chip filter-chip--active" data-continent="all">All</button>
          <button class="filter-chip" data-continent="Europe">🌍 Europe</button>
          <button class="filter-chip" data-continent="Asia">🌏 Asia</button>
          <button class="filter-chip" data-continent="Africa">🌎 Africa</button>
        </div>

        <!-- Selected banner -->
        <div id="selected-banner" style="display:none" class="glass rounded-xl p-4 mb-6 flex items-center justify-between">
          <span class="text-sm font-semibold" id="selected-count-text">0 countries selected</span>
          <button class="btn btn--xs btn--danger" id="clear-countries-btn">Clear All</button>
        </div>

        <!-- Countries grid -->
        <div id="countries-grid" class="card-grid" aria-live="polite" aria-label="Countries list">
          <!-- Skeleton loading -->
          <div class="skeleton" style="height:280px;border-radius:var(--radius-xl)"></div>
          <div class="skeleton" style="height:280px;border-radius:var(--radius-xl)"></div>
          <div class="skeleton" style="height:280px;border-radius:var(--radius-xl)"></div>
          <div class="skeleton" style="height:280px;border-radius:var(--radius-xl)"></div>
        </div>

        <div id="empty-state" class="empty-state" style="display:none">
          <div class="empty-state__icon">🌏</div>
          <div class="empty-state__title">No countries found</div>
          <p class="text-secondary">Try a different search or filter.</p>
        </div>
      </div>

      <aside class="planner-sidebar">
        <div id="expense-sidebar"></div>
        <div class="card mt-4" id="selected-countries-card">
          <div class="card__body">
            <h3 class="text-sm font-bold mb-3">🗺️ Selected Countries</h3>
            <div id="selected-countries-list">
              <p class="text-sm text-muted">No countries selected yet.</p>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <div class="step-nav">
      <button class="btn btn--ghost" onclick="history.back()">← Back</button>
      <button class="btn btn--primary btn--lg" id="next-btn" disabled>
        Continue to Cities →
      </button>
    </div>
  </div>
</main>

<div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

<script type="module">
  import { tripPlannerVM } from '../js/viewmodels/TripPlannerVM.js';
  import { ExpenseCalculatorVM } from '../js/viewmodels/ExpenseCalculatorVM.js';
  import { ValidationService } from '../js/services/ValidationService.js';
  import { renderStepper } from '../js/app.js';
  import { showToast } from '../js/utils/helpers.js';
  import { truncate } from '../js/utils/formatters.js';

  const expenseVM = new ExpenseCalculatorVM();
  expenseVM.renderSidebar(document.getElementById('expense-sidebar'));
  renderStepper(2, document.getElementById('stepper'));

  const gridEl       = document.getElementById('countries-grid');
  const nextBtn      = document.getElementById('next-btn');
  const searchEl     = document.getElementById('country-search');
  const bannerEl     = document.getElementById('selected-banner');
  const countTextEl  = document.getElementById('selected-count-text');
  const selectedList = document.getElementById('selected-countries-list');
  const emptyEl      = document.getElementById('empty-state');

  let allCountries    = [];
  let activeContinent = 'all';

  function renderCountries(list) {
    if (!list.length) {
      gridEl.innerHTML = '';
      emptyEl.style.display = 'block';
      return;
    }
    emptyEl.style.display = 'none';
    gridEl.innerHTML = list.map(c => {
      const selected = tripPlannerVM.isCountrySelected(c.id);
      return `
        <div class="card card--selectable ${selected ? 'card--selected' : ''}"
             id="country-${c.id}" data-id="${c.id}"
             role="button" tabindex="0" aria-pressed="${selected}"
             aria-label="${c.name} ${selected ? '(selected)' : ''}">
          <div class="card__image-wrapper">
            <img src="${c.imageUrl}" alt="${c.name}" class="card__image" loading="lazy"
                 onerror="this.src='https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=400&q=60'" />
            <div class="card__badge">${c.flag} ${c.continent}</div>
            ${selected ? `<div style="position:absolute;top:var(--space-3);left:var(--space-3);width:28px;height:28px;background:var(--gradient-primary);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:2;box-shadow:0 4px 10px rgba(99,102,241,.4)">✓</div>` : ''}
          </div>
          <div class="card__body">
            <div class="card__tag">${c.continent}</div>
            <h2 class="card__title">${c.name}</h2>
            <p class="card__text">${truncate(c.description, 90)}</p>
            <div class="amenity-list mt-3">
              ${c.highlights.slice(0,3).map(h => `<span class="amenity-chip">📍 ${h}</span>`).join('')}
            </div>
          </div>
          <div class="card__footer">
            <span class="text-xs text-muted">Capital: ${c.capital}</span>
            <button class="btn btn--sm ${selected ? 'btn--danger' : 'btn--primary'}" aria-label="${selected ? 'Deselect' : 'Select'} ${c.name}">
              ${selected ? '✓ Selected' : '+ Select'}
            </button>
          </div>
        </div>`;
    }).join('');

    // Attach events
    gridEl.querySelectorAll('.card--selectable').forEach(card => {
      const handler = () => toggleCountry(parseInt(card.dataset.id));
      card.addEventListener('click', handler);
      card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handler(); } });
    });
  }

  function toggleCountry(id) {
    const country = allCountries.find(c => c.id === id);
    if (!country) return;
    tripPlannerVM.toggleCountry(country);
    const selected = tripPlannerVM.isCountrySelected(id);
    showToast(
      selected ? `${country.name} added to your trip!` : `${country.name} removed.`,
      selected ? 'success' : 'warning',
      selected ? 'Country Added' : 'Country Removed'
    );
    rerender();
  }

  function rerender() {
    const selected  = tripPlannerVM.trip.countries;
    const filtered  = getFiltered();
    renderCountries(filtered);
    renderSidebar(selected);
    updateNextBtn(selected);
    expenseVM.recalculate();
    expenseVM.renderSidebar(document.getElementById('expense-sidebar'));
  }

  function renderSidebar(selected) {
    if (!selected.length) {
      bannerEl.style.display = 'none';
      selectedList.innerHTML = '<p class="text-sm text-muted">No countries selected yet.</p>';
      return;
    }
    bannerEl.style.display = 'flex';
    countTextEl.textContent = `${selected.length} ${selected.length === 1 ? 'country' : 'countries'} selected`;
    selectedList.innerHTML = selected.map(c => `
      <div class="flex items-center justify-between py-2 border-b" style="border-color:var(--border-color)">
        <span class="text-sm">${c.flag} ${c.name}</span>
        <button class="btn btn--icon-sm btn--ghost" data-remove="${c.id}" aria-label="Remove ${c.name}" style="font-size:1rem">×</button>
      </div>`).join('');
    selectedList.querySelectorAll('[data-remove]').forEach(btn => {
      btn.addEventListener('click', e => { e.stopPropagation(); toggleCountry(parseInt(btn.dataset.remove)); });
    });
  }

  function updateNextBtn(selected) {
    const errors = ValidationService.validateCountries(selected);
    nextBtn.disabled = errors.length > 0;
  }

  function getFiltered() {
    const q = searchEl.value.toLowerCase();
    return allCountries.filter(c => {
      const matchesSearch = !q || c.name.toLowerCase().includes(q) || c.continent.toLowerCase().includes(q);
      const matchesFilter = activeContinent === 'all' || c.continent === activeContinent;
      return matchesSearch && matchesFilter;
    });
  }

  // Search
  searchEl.addEventListener('input', () => renderCountries(getFiltered()));

  // Continent filter chips
  document.querySelectorAll('[data-continent]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-continent]').forEach(b => b.classList.remove('filter-chip--active'));
      btn.classList.add('filter-chip--active');
      activeContinent = btn.dataset.continent;
      renderCountries(getFiltered());
    });
  });

  // Clear all
  document.getElementById('clear-countries-btn')?.addEventListener('click', () => {
    tripPlannerVM.trip.countries.slice().forEach(c => tripPlannerVM.toggleCountry(c));
    rerender();
  });

  nextBtn.addEventListener('click', () => { window.location.href = 'select-cities.html'; });

  // Load data
  tripPlannerVM.loadCountries().then(data => {
    allCountries = data;
    renderCountries(data);
    renderSidebar(tripPlannerVM.trip.countries);
    updateNextBtn(tripPlannerVM.trip.countries);
  }).catch(() => {
    gridEl.innerHTML = '<p class="text-secondary p-8">Failed to load countries. Please refresh.</p>';
  });
</script>
</body>
</html>
