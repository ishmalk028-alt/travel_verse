<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Countries - TripPlanner</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/main.css">
    
    <style>
        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .page__header {
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-primary-600) 100%);
            padding: var(--space-8) 0;
            color: var(--color-white);
        }
        
        .page__title {
            font-family: var(--font-secondary);
            font-size: var(--text-3xl);
            font-weight: var(--font-bold);
            margin-bottom: var(--space-2);
        }
        
        .page__subtitle {
            opacity: 0.9;
        }
        
        .page__content {
            flex: 1;
            padding: var(--space-12) 0;
            background-color: var(--color-gray-50);
        }
        
        /* Stepper */
        .stepper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            padding: var(--space-4) 0;
            margin-bottom: var(--space-8);
            flex-wrap: wrap;
            gap: var(--space-2);
        }
        
        .stepper__step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
            min-width: 80px;
        }
        
        .stepper__step-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-white);
            border: 2px solid var(--color-gray-300);
            border-radius: var(--radius-full);
            color: var(--color-gray-400);
            margin-bottom: var(--space-2);
        }
        
        .stepper__step-icon svg {
            width: 24px;
            height: 24px;
        }
        
        .stepper__step-label {
            font-size: var(--text-xs);
            font-weight: var(--font-medium);
            color: var(--color-gray-500);
        }
        
        .stepper__step.is-active .stepper__step-icon {
            background-color: var(--color-primary);
            border-color: var(--color-primary);
            color: var(--color-white);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2);
        }
        
        .stepper__step.is-active .stepper__step-label {
            color: var(--color-primary);
            font-weight: var(--font-semibold);
        }
        
        .stepper__step.is-completed .stepper__step-icon {
            background-color: var(--color-success);
            border-color: var(--color-success);
            color: var(--color-white);
        }
        
        /* Selection Info */
        .selection-info {
            background-color: var(--color-white);
            border-radius: var(--radius-xl);
            padding: var(--space-4) var(--space-6);
            margin-bottom: var(--space-8);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-4);
            box-shadow: var(--shadow-sm);
        }
        
        .selection-info__text {
            font-weight: var(--font-medium);
            color: var(--color-gray-700);
        }
        
        .selection-info__count {
            color: var(--color-primary);
            font-weight: var(--font-bold);
        }
        
        /* Countries Grid */
        .countries-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--space-6);
            margin-bottom: var(--space-8);
        }
        
        /* Country Card */
        .country-card {
            position: relative;
            border-radius: var(--radius-2xl);
            overflow: hidden;
            cursor: pointer;
            box-shadow: var(--shadow-md);
            transition: all var(--transition-normal);
        }
        
        .country-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
        }
        
        .country-card__image {
            width: 100%;
            height: 240px;
            object-fit: cover;
            transition: transform var(--transition-slow);
        }
        
        .country-card:hover .country-card__image {
            transform: scale(1.05);
        }
        
        .country-card__overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: var(--space-6);
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
            color: var(--color-white);
        }
        
        .country-card__region {
            display: inline-block;
            padding: var(--space-1) var(--space-3);
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: var(--font-medium);
            margin-bottom: var(--space-2);
        }
        
        .country-card__name {
            font-family: var(--font-secondary);
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            margin-bottom: var(--space-1);
        }
        
        .country-card__description {
            font-size: var(--text-sm);
            opacity: 0.9;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .country-card__checkbox {
            position: absolute;
            top: var(--space-4);
            right: var(--space-4);
            width: 28px;
            height: 28px;
            border: 2px solid var(--color-white);
            border-radius: var(--radius-md);
            background-color: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all var(--transition-fast);
        }
        
        .country-card:hover .country-card__checkbox {
            opacity: 1;
        }
        
        .country-card.is-selected .country-card__checkbox {
            opacity: 1;
            background-color: var(--color-primary);
            border-color: var(--color-primary);
        }
        
        .country-card__checkbox svg {
            width: 16px;
            height: 16px;
            color: var(--color-white);
            opacity: 0;
        }
        
        .country-card.is-selected .country-card__checkbox svg {
            opacity: 1;
        }
        
        .country-card.is-selected {
            box-shadow: 0 0 0 3px var(--color-primary), var(--shadow-xl);
        }
        
        /* Actions */
        .page__actions {
            display: flex;
            justify-content: space-between;
            gap: var(--space-4);
            padding: var(--space-6);
            background-color: var(--color-white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
        }
        
        .page__actions .btn {
            min-width: 150px;
        }
    </style>
</head>
<body>
    <div class="page">
        <!-- Header -->
        <header class="header is-scrolled">
            <div class="container">
                <div class="header__inner">
                    <a href="../index.html" class="header__logo">
                        <svg class="header__logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="32" height="32">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                            <line x1="12" y1="22.08" x2="12" y2="12"></line>
                        </svg>
                        <span class="header__logo-text">TripPlanner</span>
                    </a>
                    <a href="../index.html" class="btn btn--outline">Back to Home</a>
                </div>
            </div>
        </header>

        <!-- Page Header -->
        <div class="page__header">
            <div class="container">
                <h1 class="page__title">Select Countries</h1>
                <p class="page__subtitle">Choose one or more countries to visit on your trip</p>
            </div>
        </div>

        <!-- Page Content -->
        <main class="page__content">
            <div class="container">
                <!-- Progress Stepper -->
                <div class="stepper">
                    <div class="stepper__step is-completed">
                        <div class="stepper__step-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                        <span class="stepper__step-label">Dates</span>
                    </div>
                    
                    <div class="stepper__step is-active">
                        <div class="stepper__step-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="2" y1="12" x2="22" y2="12"></line>
                                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                            </svg>
                        </div>
                        <span class="stepper__step-label">Countries</span>
                    </div>
                    
                    <div class="stepper__step">
                        <div class="stepper__step-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                        </div>
                        <span class="stepper__step-label">Cities</span>
                    </div>
                    
                    <div class="stepper__step">
                        <div class="stepper__step-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                                <polyline points="9 22 9 12 15 12 15 22"></polyline>
                            </svg>
                        </div>
                        <span class="stepper__step-label">Hotels</span>
                    </div>
                    
                    <div class="stepper__step">
                        <div class="stepper__step-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                            </svg>
                        </div>
                        <span class="stepper__step-label">Activities</span>
                    </div>
                    
                    <div class="stepper__step">
                        <div class="stepper__step-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                                <line x1="1" y1="10" x2="23" y2="10"></line>
                            </svg>
                        </div>
                        <span class="stepper__step-label">Checkout</span>
                    </div>
                </div>

                <!-- Selection Info -->
                <div class="selection-info">
                    <span class="selection-info__text">
                        <span class="selection-info__count" id="selectedCount">0</span> countries selected
                    </span>
                    <button class="btn btn--sm btn--outline" id="clearSelection">Clear Selection</button>
                </div>

                <!-- Countries Grid -->
                <div class="countries-grid" id="countriesGrid">
                    <!-- Countries will be populated by JS -->
                </div>

                <!-- Actions -->
                <div class="page__actions">
                    <a href="select-dates.html" class="btn btn--outline">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        Back
                    </a>
                    <button type="button" class="btn btn--primary" id="continueBtn" disabled>
                        Continue
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Sample countries data
        const countries = [
            { id: 1, name: '🇫🇷 France', region: 'Europe', description: 'Known for art, cuisine, and the iconic Eiffel Tower.', image: 'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=400&h=300&fit=crop' },
            { id: 2, name: '🇯🇵 Japan', region: 'Asia', description: 'Where ancient traditions meet cutting-edge technology.', image: 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=400&h=300&fit=crop' },
            { id: 3, name: '🇮🇹 Italy', region: 'Europe', description: 'Home to Rome, Venice, and Renaissance masterpieces.', image: 'https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=400&h=300&fit=crop' },
            { id: 4, name: '🇺🇸 USA', region: 'North America', description: 'Diverse landscapes from NYC to the Grand Canyon.', image: 'https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?w=400&h=300&fit=crop' },
            { id: 5, name: '🇹🇭 Thailand', region: 'Asia', description: 'Beautiful beaches, ancient temples, and amazing food.', image: 'https://images.unsplash.com/photo-1528181304800-259b08848526?w=400&h=300&fit=crop' },
            { id: 6, name: '🇪🇸 Spain', region: 'Europe', description: 'Flamenco, tapas, and stunning architecture.', image: 'https://images.unsplash.com/photo-1543783207-ec64e4d95325?w=400&h=300&fit=crop' },
            { id: 7, name: '🇦🇺 Australia', region: 'Oceania', description: 'Unique wildlife and the Great Barrier Reef.', image: 'https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?w=400&h=300&fit=crop' },
            { id: 8, name: '🇬🇧 UK', region: 'Europe', description: 'Rich history, castles, and vibrant culture.', image: 'https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=400&h=300&fit=crop' }
        ];
        
        let selectedCountries = [];
        
        const countriesGrid = document.getElementById('countriesGrid');
        const selectedCount = document.getElementById('selectedCount');
        const clearSelectionBtn = document.getElementById('clearSelection');
        const continueBtn = document.getElementById('continueBtn');
        
        // Render countries
        function renderCountries() {
            countriesGrid.innerHTML = countries.map(country => `
                <div class="country-card ${selectedCountries.includes(country.id) ? 'is-selected' : ''}" 
                     data-country-id="${country.id}">
                    <img src="${country.image}" alt="${country.name}" class="country-card__image">
                    <div class="country-card__overlay">
                        <span class="country-card__region">${country.region}</span>
                        <h3 class="country-card__name">${country.name}</h3>
                        <p class="country-card__description">${country.description}</p>
                    </div>
                    <div class="country-card__checkbox">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                </div>
            `).join('');
            
            // Add click listeners
            document.querySelectorAll('.country-card').forEach(card => {
                card.addEventListener('click', () => {
                    const countryId = parseInt(card.dataset.countryId);
                    toggleCountrySelection(countryId);
                });
            });
        }
        
        // Toggle selection
        function toggleCountrySelection(countryId) {
            const index = selectedCountries.indexOf(countryId);
            if (index > -1) {
                selectedCountries.splice(index, 1);
            } else {
                selectedCountries.push(countryId);
            }
            updateUI();
        }
        
        // Update UI
        function updateUI() {
            selectedCount.textContent = selectedCountries.length;
            continueBtn.disabled = selectedCountries.length === 0;
            
            document.querySelectorAll('.country-card').forEach(card => {
                const countryId = parseInt(card.dataset.countryId);
                card.classList.toggle('is-selected', selectedCountries.includes(countryId));
            });
        }
        
        // Clear selection
        clearSelectionBtn.addEventListener('click', () => {
            selectedCountries = [];
            updateUI();
        });
        
        // Continue
        continueBtn.addEventListener('click', () => {
            const selectedData = countries.filter(c => selectedCountries.includes(c.id));
            localStorage.setItem('tripCountries', JSON.stringify(selectedData));
            window.location.href = 'select-cities.html';
        });
        
        // Load saved selection
        const savedCountries = localStorage.getItem('tripCountries');
        if (savedCountries) {
            const saved = JSON.parse(savedCountries);
            selectedCountries = saved.map(c => c.id);
        }
        
        // Initialize
        renderCountries();
        updateUI();
    </script>
</body>
</html>
