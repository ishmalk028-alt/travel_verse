<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Cities — TripPlanner</title>
  <meta name="description" content="Step 3: Choose cities and allocate nights for each destination." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>" />
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body class="planner-page">

<header class="site-header">
  <div class="container">
    <div class="site-header__inner">
      <a href="../index.html" class="site-logo">
        <div class="site-logo__icon">✈️</div>
        <span class="site-logo__text">TripPlanner</span>
      </a>
      <div class="trip-progress">
        <span class="text-sm text-secondary">Step 3 of 7</span>
        <div class="trip-progress__bar">
          <div class="trip-progress__fill" style="width:42%"></div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="planner-stepper-bar">
  <div class="container"><div id="stepper"></div></div>
</div>

<main>
  <div class="container">
    <div class="planner-layout">
      <div class="planner-main">
        <div class="page-header">
          <button class="page-header__back" onclick="history.back()">← Back</button>
          <div class="section-tag"><span>🏙️</span> Step 3</div>
          <h1 class="page-header__title">Choose Your<br><span class="gradient-text">Cities & Nights</span></h1>
          <p class="page-header__subtitle">Pick cities in each country and set how many nights you'll stay.</p>
        </div>

        <div id="cities-container">
          <!-- Country groups injected by JS -->
        </div>
      </div>

      <aside class="planner-sidebar">
        <div id="expense-sidebar"></div>
        <div class="card mt-4">
          <div class="card__body">
            <h3 class="text-sm font-bold mb-3">🌙 Nights Summary</h3>
            <div id="nights-summary">
              <p class="text-sm text-muted">No cities selected yet.</p>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <div class="step-nav">
      <button class="btn btn--ghost" onclick="history.back()">← Back</button>
      <button class="btn btn--primary btn--lg" id="next-btn" disabled>
        Continue to Hotels →
      </button>
    </div>
  </div>
</main>

<div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

<script type="module">
  import { tripPlannerVM } from '../js/viewmodels/TripPlannerVM.js';
  import { ExpenseCalculatorVM } from '../js/viewmodels/ExpenseCalculatorVM.js';
  import { ValidationService } from '../js/services/ValidationService.js';
  import { renderStepper } from '../js/app.js';
  import { showToast, navigateTo } from '../js/utils/helpers.js';
  import { truncate } from '../js/utils/formatters.js';

  const expenseVM = new ExpenseCalculatorVM();
  expenseVM.renderSidebar(document.getElementById('expense-sidebar'));
  renderStepper(3, document.getElementById('stepper'));

  const countries = tripPlannerVM.trip.countries;
  const container = document.getElementById('cities-container');
  const nextBtn   = document.getElementById('next-btn');

  if (!countries.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state__icon">🌍</div>
        <div class="empty-state__title">No countries selected</div>
        <p class="text-secondary mb-6">Go back and select at least one country first.</p>
        <a href="select-countries.html" class="btn btn--primary">← Select Countries</a>
      </div>`;
  } else {
    loadAllCities();
  }

  async function loadAllCities() {
    for (const country of countries) {
      const section = document.createElement('div');
      section.className = 'mb-10';
      section.id = `country-section-${country.id}`;
      section.innerHTML = `
        <div class="flex items-center gap-3 mb-5">
          <span class="text-2xl">${country.flag}</span>
          <h2 class="text-xl font-bold">${country.name}</h2>
          <span class="badge badge--primary">${country.continent}</span>
        </div>
        <div class="card-grid" id="cities-grid-${country.id}">
          <div class="skeleton" style="height:240px;border-radius:var(--radius-xl)"></div>
          <div class="skeleton" style="height:240px;border-radius:var(--radius-xl)"></div>
          <div class="skeleton" style="height:240px;border-radius:var(--radius-xl)"></div>
        </div>`;
      container.appendChild(section);

      try {
        const cities = await tripPlannerVM.loadCities(country.id);
        renderCitiesGrid(cities, country, `cities-grid-${country.id}`);
      } catch {
        document.getElementById(`cities-grid-${country.id}`).innerHTML =
          '<p class="text-secondary">Failed to load cities.</p>';
      }
    }
    updateNextBtn();
  }

  function renderCitiesGrid(cities, country, gridId) {
    const grid = document.getElementById(gridId);
    if (!cities.length) {
      grid.innerHTML = '<p class="text-secondary">No cities available.</p>';
      return;
    }
    grid.innerHTML = cities.map(city => {
      const selected = tripPlannerVM.isCitySelected(city.id);
      const savedCity = tripPlannerVM.trip.cities.find(c => c.id === city.id);
      const nights = savedCity?.nights || 1;
      return `
        <div class="card card--selectable ${selected ? 'card--selected' : ''}"
             id="city-card-${city.id}" data-city-id="${city.id}" data-country-id="${country.id}"
             role="button" tabindex="0" aria-pressed="${selected}">
          <div class="card__image-wrapper">
            <img src="${city.imageUrl}" alt="${city.name}" class="card__image" loading="lazy"
                 onerror="this.src='https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?w=400&q=60'" />
            ${selected ? `<div class="card__badge" style="left:var(--space-3);right:auto;background:var(--gradient-primary)">✓ Selected</div>` : ''}
            <div class="card__badge">${city.bestFor}</div>
          </div>
          <div class="card__body">
            <h3 class="card__title">${city.name}</h3>
            <p class="card__text">${truncate(city.description, 80)}</p>
          </div>
          <div class="card__footer" style="flex-direction:column;align-items:stretch;gap:var(--space-3)">
            <button class="btn btn--sm btn--block ${selected ? 'btn--danger' : 'btn--secondary'}" data-toggle="${city.id}">
              ${selected ? '✓ Selected (Click to Remove)' : '+ Add to Trip'}
            </button>
            ${selected ? `
            <div class="counter-input" style="justify-content:center">
              <button class="counter-input__btn" data-decrement="${city.id}" aria-label="Decrease nights">−</button>
              <span class="counter-input__value" id="nights-${city.id}">${nights}</span>
              <button class="counter-input__btn" data-increment="${city.id}" aria-label="Increase nights">+</button>
              <span class="text-xs text-muted">nights</span>
            </div>` : ''}
          </div>
        </div>`;
    }).join('');

    // Toggle buttons
    grid.querySelectorAll('[data-toggle]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const cityId  = parseInt(btn.dataset.toggle);
        const city    = cities.find(c => c.id === cityId);
        tripPlannerVM.toggleCity({ ...city, countryId: country.id });
        const isNow = tripPlannerVM.isCitySelected(cityId);
        showToast(
          isNow ? `${city.name} added!` : `${city.name} removed.`,
          isNow ? 'success' : 'warning'
        );
        renderCitiesGrid(cities, country, gridId);
        updateNightsSummary();
        updateNextBtn();
      });
    });

    // Counter buttons
    grid.querySelectorAll('[data-increment]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const cityId  = parseInt(btn.dataset.increment);
        const current = parseInt(document.getElementById(`nights-${cityId}`).textContent);
        tripPlannerVM.setCityNights(cityId, current + 1);
        document.getElementById(`nights-${cityId}`).textContent = current + 1;
        updateNightsSummary();
      });
    });
    grid.querySelectorAll('[data-decrement]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const cityId  = parseInt(btn.dataset.decrement);
        const current = parseInt(document.getElementById(`nights-${cityId}`).textContent);
        if (current <= 1) return;
        tripPlannerVM.setCityNights(cityId, current - 1);
        document.getElementById(`nights-${cityId}`).textContent = current - 1;
        updateNightsSummary();
      });
    });
  }

  function updateNightsSummary() {
    const cities  = tripPlannerVM.trip.cities;
    const sumEl   = document.getElementById('nights-summary');
    if (!cities.length) {
      sumEl.innerHTML = '<p class="text-sm text-muted">No cities selected yet.</p>';
      return;
    }
    const total = cities.reduce((s, c) => s + c.nights, 0);
    sumEl.innerHTML = cities.map(c => `
      <div class="flex justify-between py-2 border-b" style="border-color:var(--border-color)">
        <span class="text-sm">${c.name}</span>
        <span class="text-sm font-semibold text-primary">${c.nights}n</span>
      </div>`).join('') +
      `<div class="flex justify-between py-2 font-bold text-sm">
        <span>Total</span><span class="gradient-text">${total} nights</span>
      </div>`;
  }

  function updateNextBtn() {
    const errors = ValidationService.validateCities(tripPlannerVM.trip.cities);
    nextBtn.disabled = errors.length > 0;
    updateNightsSummary();
  }

  nextBtn.addEventListener('click', () => { window.location.href = 'select-hotels.html'; });
</script>
</body>
</html>
