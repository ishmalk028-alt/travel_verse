<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Cities - TripPlanner</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/main.css">
    
    <style>
        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .page__header {
            background: var(--color-white);
            padding: var(--space-8) 0;
            color: var(--color-white);
        }
        
        .page__title {
            font-family: var(--font-secondary);
            font-size: var(--text-3xl);
            font-weight: var(--font-bold);
            margin-bottom: var(--space-2);
        }
        
        .page__subtitle {
            opacity: 0.9;
        }
        
        .page__content {
            flex: 1;
            padding: var(--space-12) 0;
            background-color: var(--color-gray-50);
        }
        
        /* Stepper (same as other pages) */
        .stepper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: var(--space-4) 0;
            margin-bottom: var(--space-8);
            flex-wrap: wrap;
            gap: var(--space-2);
        }
        
        .stepper__step {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }
        
        .stepper__step-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-white);
            border: 2px solid var(--color-gray-300);
            border-radius: var(--radius-full);
            color: var(--color-gray-400);
            margin-bottom: var(--space-2);
        }
        
        .stepper__step-icon svg { width: 24px; height: 24px; }
        .stepper__step-label { font-size: var(--text-xs); font-weight: var(--font-medium); color: var(--color-gray-500); }
        .stepper__step.is-active .stepper__step-icon { background-color: var(--color-primary); border-color: var(--color-primary); color: var(--color-white); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.2); }
        .stepper__step.is-active .stepper__step-label { color: var(--color-primary); font-weight: var(--font-semibold); }
        .stepper__step.is-completed .stepper__step-icon { background-color: var(--color-success); border-color: var(--color-success); color: var(--color-white); }
        
        /* Country Section */
        .country-section {
            margin-bottom: var(--space-12);
        }
        
        .country-section__header {
            display: flex;
            align-items: center;
            gap: var(--space-4);
            margin-bottom: var(--space-6);
        }
        
        .country-section__title {
            font-family: var(--font-secondary);
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            color: var(--color-gray-800);
        }
        
        .country-section__badge {
            padding: var(--space-1) var(--space-3);
            background-color: var(--color-primary-100);
            color: var(--color-primary);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            border-radius: var(--radius-full);
        }
        
        /* Cities Grid */
        .cities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--space-6);
        }
        
        /* City Card */
        .city-card {
            position: relative;
            background-color: var(--color-white);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            cursor: pointer;
            transition: all var(--transition-normal);
        }
        
        .city-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-xl);
        }
        
        .city-card.is-selected {
            box-shadow: 0 0 0 3px var(--color-primary), var(--shadow-xl);
        }
        
        .city-card__image {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }
        
        .city-card__body {
            padding: var(--space-5);
        }
        
        .city-card__header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--space-3);
        }
        
        .city-card__name {
            font-family: var(--font-secondary);
            font-size: var(--text-lg);
            font-weight: var(--font-semibold);
            color: var(--color-gray-800);
        }
        
        .city-card__country {
            font-size: var(--text-sm);
            color: var(--color-gray-500);
        }
        
        .city-card__description {
            font-size: var(--text-sm);
            color: var(--color-gray-600);
            margin-bottom: var(--space-4);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* Nights Control */
        .city-card__nights {
            display: none;
            padding-top: var(--space-4);
            border-top: 1px solid var(--color-gray-100);
        }
        
        .city-card.is-selected .city-card__nights {
            display: block;
        }
        
        .city-card__nights-label {
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
            color: var(--color-gray-700);
            margin-bottom: var(--space-2);
        }
        
        .city-card__nights-control {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }
        
        .city-card__nights-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-gray-100);
            border: none;
            border-radius: var(--radius-lg);
            font-size: var(--text-xl);
            font-weight: var(--font-bold);
            color: var(--color-gray-600);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        
        .city-card__nights-btn:hover {
            background-color: var(--color-primary);
            color: var(--color-white);
        }
        
        .city-card__nights-value {
            width: 50px;
            height: 36px;
            text-align: center;
            border: 2px solid var(--color-gray-200);
            border-radius: var(--radius-lg);
            font-size: var(--text-lg);
            font-weight: var(--font-semibold);
            color: var(--color-gray-800);
            -moz-appearance: textfield;
        }
        
        .city-card__nights-value::-webkit-outer-spin-button,
        .city-card__nights-value::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        .city-card__nights-text {
            font-size: var(--text-sm);
            color: var(--color-gray-500);
        }
        
        /* Checkbox */
        .city-card__checkbox {
            position: absolute;
            top: var(--space-3);
            right: var(--space-3);
            width: 24px;
            height: 24px;
            border: 2px solid var(--color-white);
            border-radius: var(--radius-md);
            background-color: rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all var(--transition-fast);
        }
        
        .city-card:hover .city-card__checkbox { opacity: 1; }
        .city-card.is-selected .city-card__checkbox { opacity: 1; background-color: var(--color-primary); border-color: var(--color-primary); }
        .city-card__checkbox svg { width: 14px; height: 14px; color: var(--color-white); opacity: 0; }
        .city-card.is-selected .city-card__checkbox svg { opacity: 1; }
        
        /* Selection Summary */
        .selection-summary {
            background-color: var(--color-white);
            border-radius: var(--radius-xl);
            padding: var(--space-6);
            margin-bottom: var(--space-8);
            box-shadow: var(--shadow-sm);
        }
        
        .selection-summary__title {
            font-weight: var(--font-semibold);
            color: var(--color-gray-800);
            margin-bottom: var(--space-4);
        }
        
        .selection-summary__items {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-3);
        }
        
        .selection-summary__item {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4);
            background-color: var(--color-primary-50);
            color: var(--color-primary);
            border-radius: var(--radius-full);
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
        }
        
        /* Actions */
        .page__actions {
            display: flex;
            justify-content: space-between;
            gap: var(--space-4);
            padding: var(--space-6);
            background-color: var(--color-white);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-sm);
        }
        
        .page__actions .btn { min-width: 150px; }
    </style>

</head>
<body class="theme-professional">
    <div class="page">
        <!-- Header -->
        <header class="header is-scrolled">
            <div class="container">
                <div class="header__inner">
                    <a href="../index.html" class="header__logo">
                        <svg class="header__logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="32" height="32">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>

                        </svg>

        <!-- Page Header -->

        <!-- Page Content -->

                    </div>
                    <div class="stepper__step is-completed">
                        <div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                        <span class="stepper__step-label">Countries</span>
                    </div>
                    <div class="stepper__step is-active">
                        <div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"></path><circle cx="12" cy="10" r="3"></circle></svg></div>
                        <span class="stepper__step-label">Cities</span>
                    </div>
                    <div class="stepper__step">
                        <div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
                        <span class="stepper__step-label">Hotels</span>
                    </div>
                    <div class="stepper__step">
                        <div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg></div>
                        <span class="stepper__step-label">Activities</span>
                    </div>
                    <div class="stepper__step">
                        <div class="stepper__step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg></div>
                        <span class="stepper__step-label">Checkout</span>

                <!-- Selection Summary -->
                <div class="selection-summary" id="selectionSummary" style="display: none;">

                <!-- Cities by Country -->
                <div id="citiesContainer"></div>

                <!-- Actions -->
                <div class="page__actions">
                    <a href="select-countries.html" class="btn btn--outline">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                        Back
                    </a>
                    <button type="button" class="btn btn--primary" id="continueBtn" disabled>
                        Continue
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/services/ApiService.js"></script>
    <script>
        const api = new ApiService();

        // Fallback cities shown only if the API is unavailable.
        let citiesByCountry = {
            1: [ // France
                { id: 1, name: 'Paris', description: 'The City of Light - home to the Eiffel Tower and Louvre.', image: 'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=400&h=200&fit=crop' },
                { id: 2, name: 'Nice', description: 'Beautiful coastal city on the French Riviera.', image: 'https://images.unsplash.com/photo-1533104816931-20fa691ff6ca?w=400&h=200&fit=crop' }
            ],
            2: [ // Japan
                { id: 3, name: 'Tokyo', description: 'Bustling metropolis blending tradition and technology.', image: 'https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=400&h=200&fit=crop' },
                { id: 4, name: 'Kyoto', description: 'Ancient capital with temples and traditional gardens.', image: 'https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=400&h=200&fit=crop' }
            ],
            3: [ // Italy
                { id: 5, name: 'Rome', description: 'The Eternal City - home to the Colosseum and Vatican.', image: 'https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=400&h=200&fit=crop' },
                { id: 6, name: 'Venice', description: 'Romantic city of canals and gondolas.', image: 'https://images.unsplash.com/photo-1514890547357-a9ee288728e0?w=400&h=200&fit=crop' }
            ],
            4: [ // USA
                { id: 7, name: 'New York', description: 'The city that never sleeps - Times Square, Central Park.', image: 'https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?w=400&h=200&fit=crop' },
                { id: 8, name: 'Los Angeles', description: 'Hollywood, beaches, and sunny California vibes.', image: 'https://images.unsplash.com/photo-1534190760961-74e8c1c5c3da?w=400&h=200&fit=crop' }
            ],
            5: [ // Thailand
                { id: 9, name: 'Bangkok', description: 'Vibrant capital with temples and street food.', image: 'https://images.unsplash.com/photo-1508009603885-50cf7c579365?w=400&h=200&fit=crop' },
                { id: 10, name: 'Phuket', description: 'Tropical paradise with stunning beaches.', image: 'https://images.unsplash.com/photo-1589394815804-964ed0be2eb5?w=400&h=200&fit=crop' }
            ],
            6: [ // Spain
                { id: 11, name: 'Barcelona', description: 'Gaudi architecture and beautiful beaches.', image: 'https://images.unsplash.com/photo-1583422409516-2895a77efded?w=400&h=200&fit=crop' },
                { id: 12, name: 'Madrid', description: 'Spain\'s capital with world-class museums.', image: 'https://images.unsplash.com/photo-1543783207-ec64e4d95325?w=400&h=200&fit=crop' }
            ],
            7: [ // Australia
                { id: 13, name: 'Sydney', description: 'Opera House, Harbour Bridge, and beautiful beaches.', image: 'https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?w=400&h=200&fit=crop' },
                { id: 14, name: 'Melbourne', description: 'Cultural hub with arts, coffee, and sports.', image: 'https://images.unsplash.com/photo-1514395462725-fb4566210144?w=400&h=200&fit=crop' }
            ],
            8: [ // UK
                { id: 15, name: 'London', description: 'Historic landmarks, museums, and royal palaces.', image: 'https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=400&h=200&fit=crop' },
                { id: 16, name: 'Edinburgh', description: 'Medieval castle and charming old town.', image: 'https://images.unsplash.com/photo-1506377585622-bedcbb027afc?w=400&h=200&fit=crop' }
            ]
        };
        
        let selectedCities = {}; // { cityId: nights }
        let selectedCountries = [];
        
        // Load selected countries
        const savedCountries = localStorage.getItem('tripCountries');
        if (savedCountries) {
            selectedCountries = JSON.parse(savedCountries);
        } else {
            window.location.href = 'select-countries.html';
        }
        
        const citiesContainer = document.getElementById('citiesContainer');
        const selectionSummary = document.getElementById('selectionSummary');
        const selectedItems = document.getElementById('selectedItems');
        const continueBtn = document.getElementById('continueBtn');

        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[char]));
        }
        
        // Render cities
        function renderCities() {
            citiesContainer.innerHTML = selectedCountries.map(country => {
                const cities = citiesByCountry[country.id] || [];
                return `
                    <div class="country-section">
                        <div class="country-section__header">
                            <h2 class="country-section__title">${escapeHtml(country.name)}</h2>
                            <span class="country-section__badge">${cities.length} cities</span>
                        </div>
                        <div class="cities-grid">
                            ${cities.map(city => `
                                <div class="city-card ${selectedCities[city.id] ? 'is-selected' : ''}" data-city-id="${city.id}" data-country-id="${country.id}" data-city-name="${escapeHtml(city.name)}">
                                    <img src="${escapeHtml(city.image || city.image_url || city.imageUrl)}" alt="${escapeHtml(city.name)}" class="city-card__image">
                                    <div class="city-card__body">
                                        <div class="city-card__header">
                                            <div>
                                                <h3 class="city-card__name">${escapeHtml(city.name)}</h3>
                                                <span class="city-card__country">${escapeHtml(country.name)}</span>
                                            </div>
                                        </div>
                                        <p class="city-card__description">${escapeHtml(city.description)}</p>
                                        <div class="city-card__nights">
                                            <div class="city-card__nights-label">Number of nights:</div>
                                            <div class="city-card__nights-control">
                                                <button type="button" class="city-card__nights-btn" data-action="decrease">−</button>
                                                <input type="number" class="city-card__nights-value" value="${selectedCities[city.id] || 2}" min="1" max="30" data-nights-input>
                                                <button type="button" class="city-card__nights-btn" data-action="increase">+</button>
                                                <span class="city-card__nights-text">night(s)</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="city-card__checkbox">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
            
            // Add event listeners
            document.querySelectorAll('.city-card').forEach(card => {
                const cityId = parseInt(card.dataset.cityId);
                const nightsInput = card.querySelector('[data-nights-input]');
                const decreaseBtn = card.querySelector('[data-action="decrease"]');
                const increaseBtn = card.querySelector('[data-action="increase"]');
                
                // Card click (toggle selection)
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.city-card__nights-control')) return;
                    toggleCitySelection(cityId, parseInt(nightsInput.value));
                });
                
                // Nights control
                decreaseBtn.addEventListener('click', () => {
                    if (nightsInput.value > 1) {
                        nightsInput.value = parseInt(nightsInput.value) - 1;
                        if (selectedCities[cityId]) {
                            selectedCities[cityId] = parseInt(nightsInput.value);
                            updateSummary();
                        }
                    }
                });
                
                increaseBtn.addEventListener('click', () => {
                    if (nightsInput.value < 30) {
                        nightsInput.value = parseInt(nightsInput.value) + 1;
                        if (selectedCities[cityId]) {
                            selectedCities[cityId] = parseInt(nightsInput.value);
                            updateSummary();
                        }
                    }
                });
                
                nightsInput.addEventListener('change', () => {
                    if (selectedCities[cityId]) {
                        selectedCities[cityId] = parseInt(nightsInput.value) || 1;
                        updateSummary();
                    }
                });
            });
        }
        
        function toggleCitySelection(cityId, nights) {
            if (selectedCities[cityId]) {
                delete selectedCities[cityId];
            } else {
                selectedCities[cityId] = nights;
            }
            updateUI();
        }
        
        function updateUI() {
            document.querySelectorAll('.city-card').forEach(card => {
                const cityId = parseInt(card.dataset.cityId);
                card.classList.toggle('is-selected', !!selectedCities[cityId]);
            });
            updateSummary();
        }
        
        function updateSummary() {
            const cityIds = Object.keys(selectedCities);
            if (cityIds.length > 0) {
                selectionSummary.style.display = 'block';
                selectedItems.innerHTML = cityIds.map(id => {
                    const card = document.querySelector(`[data-city-id="${id}"]`);
                    const name = card ? card.dataset.cityName : 'City';
                    return `<span class="selection-summary__item">${escapeHtml(name)} - ${selectedCities[id]} nights</span>`;
                }).join('');
                continueBtn.disabled = false;
            } else {
                selectionSummary.style.display = 'none';
                continueBtn.disabled = true;
            }
        }
        
        // Continue button
        continueBtn.addEventListener('click', () => {
            const cityData = Object.keys(selectedCities).map(id => {
                const card = document.querySelector(`[data-city-id="${id}"]`);
                return {
                    id: parseInt(id),
                    countryId: card ? parseInt(card.dataset.countryId) : null,
                    name: card ? card.dataset.cityName : 'City',
                    nights: selectedCities[id]
                };
            });
            localStorage.setItem('tripCities', JSON.stringify(cityData));
            window.location.href = 'select-hotels.html';
        });
        
        // Load saved cities
        const savedCities = localStorage.getItem('tripCities');
        if (savedCities) {
            const cities = JSON.parse(savedCities);
            cities.forEach(c => { selectedCities[c.id] = c.nights; });
        }
        
        async function loadCities() {
            citiesContainer.innerHTML = '<p style="color: var(--color-gray-500);">Loading cities...</p>';

            try {
                const loaded = await Promise.all(selectedCountries.map(async country => {
                    const cities = await api.getCitiesByCountry(country.id);
                    return [country.id, cities];
                }));

                loaded.forEach(([countryId, cities]) => {
                    if (cities.length) {
                        citiesByCountry[countryId] = cities;
                    }
                });
            } catch (error) {
                console.warn('Using fallback cities:', error);
            }

            renderCities();
            updateUI();
        }

        loadCities();
    </script>
</body>
</html>
